<style>
  :root{
    --bg:#F5F6F3;
    --surface:#FFFFFF;
    --ink:#1B2422;
    --ink-muted:#5B655F;
    --line:#D3D8D1;
    --line-soft:#E6E9E3;
    --navy:#1E3A52;
    --navy-soft:#E9EEF1;
    --teal:#2F7A6E;
    --teal-soft:#E4F1EE;
    --rust:#A3492C;
    --rust-soft:#F5E9E3;
    --amber:#8A6A1E;
    --amber-soft:#F3ECD9;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
  }

  body{
    font-family:'Calibri', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 60px 0;
  }

  .ruler{
    height:20px;
    width:100%;
    background:repeating-linear-gradient(
      to right,
      var(--line) 0,
      var(--line) 1px,
      transparent 1px,
      transparent 40px
    );
    border-bottom:1px solid var(--line);
  }

  header.top{
    max-width:1180px;
    margin:0 auto;
    padding:32px 28px 16px 28px;
  }

  .brand-row{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--navy);
    display:flex;
    align-items:center;
    gap:10px;
  }

  .eyebrow .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--teal);
    display:inline-block;
  }

  h1{
    font-weight:600;
    font-size:32px;
    line-height:1.1;
    margin:8px 0 4px 0;
  }

  .category-bar{
    max-width:1180px;
    margin:28px auto 0 auto;
    padding:0 28px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .category-bar button{
    font-family:'Calibri', sans-serif;
    font-weight:600;
    font-size:15px;
    padding:12px 20px;
    border:1px solid var(--line);
    border-radius:4px 4px 0 0;
    border-bottom:none;
    background:var(--line-soft);
    color:var(--ink-muted);
    cursor:pointer;
  }

  .category-bar button:hover{
    background:var(--navy-soft);
    color:var(--navy);
  }

  .category-bar button.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
  }

  .tab-bar{
    max-width:1180px;
    margin:0 auto;
    padding:0 28px;
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    border-bottom:1px solid var(--line);
  }

  .tab-bar button{
    font-family:'Calibri', sans-serif;
    font-size:12px;
    line-height:1.25;
    padding:8px 14px;
    border:none;
    background:transparent;
    color:var(--ink-muted);
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    max-width:110px;
    white-space:normal;
    text-align:center;
  }

  .tab-bar button:hover{color:var(--ink);}

  /* Indicador sin datos: texto gris claro, sin fondo especial */
  .tab-bar button{
    color:#9AA39E;
  }

  /* Indicador con datos: texto oscuro y más fuerte */
  .tab-bar button.available{
    background:transparent;
    color:var(--ink);
    font-weight:700;
  }

  .tab-bar button.available:hover{
    background:var(--navy-soft);
    color:var(--navy);
  }

  /* Solo un indicador con datos puede encender su pestaña */
  .tab-bar button.available.active{
    background:var(--navy);
    color:#fff;
    border-bottom-color:var(--navy);
    border-radius:3px 3px 0 0;
    font-weight:700;
  }

  .category-empty{
    max-width:1180px;
    margin:20px auto 0 auto;
    padding:32px 28px;
    text-align:center;
    color:var(--ink-muted);
    font-size:14px;
    font-style:italic;
    border:1px dashed var(--line);
    border-radius:4px;
  }

  /* Panel de actualización, oculto por defecto en Index.html */
  .upload-panel{
    max-width:1124px;
    margin:14px auto 0 auto;
    padding:16px 18px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:4px;
  }

  .upload-panel[hidden]{
    display:none !important;
  }

  .upload-panel-header{
    margin-bottom:12px;
  }

  .upload-panel-title{
    font-size:14px;
    font-weight:600;
    color:var(--navy);
    margin-bottom:3px;
  }

  .upload-panel-help{
    font-size:12.5px;
    line-height:1.4;
    color:var(--ink-muted);
    max-width:820px;
  }

  .upload-panel-controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }

  .upload-panel input[type="file"]{
    flex:1 1 360px;
    min-width:260px;
    padding:7px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--bg);
    color:var(--ink);
    font-family:'Calibri', sans-serif;
    font-size:13px;
  }

  .upload-panel input[type="file"]::file-selector-button{
    margin-right:10px;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--navy-soft);
    color:var(--navy);
    font-family:'Calibri', sans-serif;
    font-weight:600;
    cursor:pointer;
  }

  #datasetUploadBtn{
    padding:9px 15px;
    border:1px solid var(--navy);
    border-radius:3px;
    background:var(--navy);
    color:#fff;
    font-family:'Calibri', sans-serif;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }

  #datasetUploadBtn:disabled{
    opacity:.55;
    cursor:not-allowed;
  }

  .upload-panel-status{
    min-height:18px;
    margin-top:9px;
    font-size:12.5px;
    color:var(--ink-muted);
  }

  /* Contenido de Matrícula */
  .dataset-view{
    max-width:1180px;
    margin:20px auto 0 auto;
    padding:0 28px;
  }

  .dataset-view-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:14px;
  }

  .dataset-view-title-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
  }

  .dataset-view-title{
    font-size:22px;
    font-weight:600;
    color:var(--navy);
  }

  .dataset-view-subtitle{
    margin-top:3px;
    font-size:12.5px;
    color:var(--ink-muted);
  }

  .download-link{
    border:none;
    padding:2px 0;
    background:transparent;
    color:var(--navy);
    font-family:'Calibri', sans-serif;
    font-size:12.5px;
    font-weight:600;
    text-decoration:underline;
    text-underline-offset:2px;
    cursor:pointer;
  }

  .download-link:hover{
    color:var(--teal);
  }

  .download-link.disabled,
  .download-link:disabled{
    color:#AEB5B1;
    text-decoration:none;
    cursor:default;
  }

  .update-link{
    border:none;
    padding:2px 0;
    background:transparent;
    color:var(--teal);
    font-family:'Calibri', sans-serif;
    font-size:12.5px;
    text-decoration:underline;
    text-underline-offset:2px;
    cursor:pointer;
  }

  .update-link:hover{
    color:var(--navy);
  }

  .filter-panel{
    padding:14px 16px 16px 16px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:4px;
  }

  .filter-panel-title{
    margin-bottom:10px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-muted);
  }

  .filter-grid{
    display:grid;
    grid-template-columns:repeat(4, minmax(0,1fr));
    gap:12px;
  }

  .filter-grid-six{
    grid-template-columns:repeat(3, minmax(0,1fr));
  }

  .filter-field{
    display:flex;
    flex-direction:column;
    gap:5px;
  }

  .filter-field span{
    font-size:11px;
    font-weight:600;
    color:var(--ink-muted);
  }

  .filter-field select{
    width:100%;
    min-height:36px;
    padding:7px 9px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--surface);
    color:var(--ink);
    font-family:'Calibri', sans-serif;
    font-size:13px;
  }

  .filter-field select:disabled{
    background:var(--line-soft);
    color:var(--ink-muted);
  }

  .kpi-grid{
    display:grid;
    grid-template-columns:repeat(4, minmax(0,1fr));
    gap:12px;
    margin-top:14px;
  }

  .kpi-card{
    padding:16px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:4px;
  }

  .kpi-label{
    font-size:11px;
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-muted);
  }

  .kpi-value{
    margin-top:6px;
    font-family:'IBM Plex Mono','Consolas',monospace;
    font-size:30px;
    line-height:1.1;
    color:var(--navy);
  }

  .kpi-note{
    margin-top:5px;
    font-size:11.5px;
    color:var(--ink-muted);
  }

  .charts-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:14px;
    margin-top:14px;
  }

  .chart-card{
    min-width:0;
    padding:16px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:4px;
  }

  .chart-card-wide{
    grid-column:1 / -1;
  }

  .chart-title{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
  }

  .chart-subtitle{
    margin-top:2px;
    margin-bottom:14px;
    font-size:11.5px;
    color:var(--ink-muted);
  }

  .bar-chart{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .bar-row{
    display:grid;
    grid-template-columns:minmax(90px, 150px) 1fr auto;
    align-items:center;
    gap:9px;
    min-height:22px;
  }

  .bar-label{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:11.5px;
    color:var(--ink-muted);
  }

  .bar-track{
    position:relative;
    height:10px;
    overflow:hidden;
    border-radius:2px;
    background:var(--line-soft);
  }

  .bar-fill{
    height:100%;
    min-width:2px;
    border-radius:2px;
    background:var(--teal);
  }

  .bar-value{
    min-width:48px;
    text-align:right;
    font-family:'IBM Plex Mono','Consolas',monospace;
    font-size:11.5px;
    color:var(--ink);
  }

  .chart-empty{
    padding:22px 12px;
    text-align:center;
    color:var(--ink-muted);
    font-size:12.5px;
    font-style:italic;
  }

  .consistency-note{
    margin-top:14px;
    padding:13px 15px;
    border-left:3px solid var(--amber);
    background:var(--amber-soft);
    color:var(--ink);
    font-size:12px;
    line-height:1.45;
  }

  .consistency-note[hidden]{
    display:none !important;
  }

  .consistency-note-title{
    font-weight:700;
    color:var(--amber);
    margin-bottom:4px;
  }

  .consistency-note-text{
    color:var(--ink-muted);
  }

  .consistency-note ul{
    margin:8px 0 0 18px;
    padding:0;
  }

  .dataset-status{
    margin-top:14px;
    padding:9px 12px;
    border-left:3px solid var(--teal);
    background:var(--teal-soft);
    color:var(--ink-muted);
    font-size:11.5px;
  }

  .dataset-status.error{
    border-left-color:var(--rust);
    background:var(--rust-soft);
    color:var(--rust);
  }

  @media (max-width:900px){
    .filter-grid,
    .kpi-grid{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .charts-grid{
      grid-template-columns:1fr;
    }

    .chart-card-wide{
      grid-column:auto;
    }
  }

  @media (max-width:560px){
    .filter-grid,
    .kpi-grid{
      grid-template-columns:1fr;
    }

    .bar-row{
      grid-template-columns:95px 1fr auto;
    }

    .upload-panel,
    .dataset-view{
      margin-left:0;
      margin-right:0;
    }
  }
</style>
