    case 'matricula':
      renderMatriculaBase_();

    case 'composicion':
      renderComposicionMatriculaBase_();
      cargarComposicionMatriculaOficial_();
      return true;

    case 'oferta':
      renderOfertaBase_();
      cargarOfertaOficial_();
      return true;

    case 'retencion':
      renderRetencionBase_();
      cargarRetencionDesdeComposicion_();
      return true;

    case 'tasa_titulacion':
      renderTasaTitulacionBase_();
      cargarTasaTitulacion_();
      return true;

    case 'titulacion':
      renderTituladosBase_();
      cargarTituladosOficial_();
      return true;

    case 'dotacion':
      renderDotacionBase_();
      cargarDotacionOficial_();
      return true;

    default:
      return false;
  }
}

function recargarIndicadorAcademico_(tipo){
  if (tipo === 'matricula' && currentTab === 'matricula') {
    cargarMatriculaOficial_();

  else if (tipo === 'composicion_matricula' && currentTab === 'composicion') {
    cargarComposicionMatriculaOficial_();

  else if (tipo === 'oferta' && currentTab === 'oferta') {
    cargarOfertaOficial_();
  }
  else if (tipo === 'titulados' && currentTab === 'titulacion') {
    cargarTituladosOficial_();
  }
  else if (tipo === 'dotacion' && currentTab === 'dotacion') {
    cargarDotacionOficial_();
  }
}

function cargarMatriculaOficial_(){
  google.script.run
    .withSuccessHandler(function(respuesta){
      window.datasetCache.matricula = respuesta.registros;
      window.datasetMeta.matricula = {
        cantidadRegistros: respuesta.cantidadRegistros,
        cantidadColumnas: respuesta.cantidadColumnas,
        encabezados: respuesta.encabezados
      };

      aplicarDatosMatricula_(respuesta);
    })
    .withFailureHandler(function(error){
      const estado = document.getElementById('matriculaEstado');
      const resumen = document.getElementById('matriculaResumen');

      if (resumen) resumen.textContent = 'No fue posible cargar el dataset.';
      if (estado) {
        estado.textContent =
          'Error al cargar matricula.csv: ' +
          (error && error.message ? error.message : String(error));
        estado.classList.add('error');
      }

      console.error('Error cargando Matrícula:', error);
    })
    .obtenerDataset('matricula');
}

function aplicarDatosMatricula_(respuesta){
  const resumen = document.getElementById('matriculaResumen');
  const estado = document.getElementById('matriculaEstado');

  cargarOpcionesFiltro_('filtroMatriculaAno', respuesta.filtros.anos, 'Todos');
  cargarOpcionesFiltro_('filtroMatriculaSede', respuesta.filtros.sedes, 'Todas');
  cargarOpcionesFiltro_('filtroMatriculaCarrera', respuesta.filtros.carreras, 'Todas');
  cargarOpcionesFiltro_('filtroMatriculaJornada', respuesta.filtros.jornadas, 'Todas');

  configurarFiltrosMatricula_();
  actualizarVisualizacionesMatricula_();

  if (resumen) {
    resumen.textContent =
      `${respuesta.cantidadRegistros.toLocaleString('es-CL')} registros · ` +
      `${respuesta.cantidadColumnas.toLocaleString('es-CL')} columnas · ${respuesta.archivoOficial}`;
  }

  if (estado) {
    estado.textContent = 'Dataset oficial cargado correctamente.';
    estado.classList.remove('error');
  }
}

function configurarFiltrosMatricula_(){
  [
    'filtroMatriculaAno',
    'filtroMatriculaSede',
    'filtroMatriculaCarrera',
    'filtroMatriculaJornada'
  ].forEach(function(id){
    const control = document.getElementById(id);
    if (!control || control.dataset.listenerConfigurado === '1') return;

    control.addEventListener('change', actualizarVisualizacionesMatricula_);
    control.dataset.listenerConfigurado = '1';
  });
}

function obtenerFiltrosMatricula_(){
  return {
    ano: obtenerValorFiltro_('filtroMatriculaAno'),
    sede: obtenerValorFiltro_('filtroMatriculaSede'),
    carrera: obtenerValorFiltro_('filtroMatriculaCarrera'),
    jornada: obtenerValorFiltro_('filtroMatriculaJornada')
  };
}

function obtenerMatriculaFiltrada_(){
  const registros = window.datasetCache.matricula || [];
  const filtros = obtenerFiltrosMatricula_();

  return registros.filter(function(registro){
    return (!filtros.ano || String(registro['AÑO']) === filtros.ano) &&
           (!filtros.sede || String(registro['NOMBRE SEDE']) === filtros.sede) &&
           (!filtros.carrera || String(registro['NOMBRE CARRERA']) === filtros.carrera) &&
           (!filtros.jornada || String(registro['JORNADA']) === filtros.jornada);
  });
}

function actualizarVisualizacionesMatricula_(){
  const registros = obtenerMatriculaFiltrada_();

  actualizarKPIsMatricula_(registros);

  dibujarBarras_(
    'graficoMatriculaAno',

    12

  dibujarBarras_(

    12

  dibujarBarras_(

function actualizarKPIsMatricula_(registros){
  const total = registros.reduce(
    (suma, registro) => suma + numeroMatricula_(registro['TOTAL MATRÍCULA']),
    0
  );

  asignarTexto_('kpiMatriculaTotal', formatearNumero_(total));
  asignarTexto_('kpiRegistros', formatearNumero_(registros.length));
  asignarTexto_(
    'kpiCarreras',
    formatearNumero_(cantidadUnicos_(registros, 'NOMBRE CARRERA'))
  );
  asignarTexto_(
    'kpiSedes',
    formatearNumero_(cantidadUnicos_(registros, 'NOMBRE SEDE'))
  );
}

function agregarMatriculaPorCampo_(registros, campo, ordenarAno){
  const mapa = {};

  registros.forEach(function(registro){
    let etiqueta = String(registro[campo] || '').trim();
    if (!etiqueta) return;

    if (ordenarAno) {
      etiqueta = extraerAnoFrontend_(etiqueta);
    }

    mapa[etiqueta] =
      (mapa[etiqueta] || 0) +
      numeroMatricula_(registro['TOTAL MATRÍCULA']);
  });

  const resultado = Object.keys(mapa)
    .map(etiqueta => ({ etiqueta, valor: mapa[etiqueta] }));

  if (ordenarAno) {
    return resultado.sort((a, b) => Number(a.etiqueta) - Number(b.etiqueta));
  }

  return resultado.sort((a, b) => b.valor - a.valor);
}

function numeroMatricula_(valor){
  const limpio = String(valor === null || valor === undefined ? '' : valor)
    .trim()
    .replace(/[^\d-]/g, '');

  const numero = Number(limpio);
  return Number.isFinite(numero) ? numero : 0;
}

function cargarComposicionMatriculaOficial_(){
  google.script.run
    .withSuccessHandler(function(respuesta){
      window.datasetCache.composicion_matricula = respuesta.registros;
      window.datasetMeta.composicion_matricula = {
        cantidadRegistros: respuesta.cantidadRegistros,
        cantidadColumnas: respuesta.cantidadColumnas,
        encabezados: respuesta.encabezados
      };

      aplicarDatosComposicion_(respuesta);
    })
    .withFailureHandler(function(error){
      const estado = document.getElementById('composicionEstado');
      const resumen = document.getElementById('composicionResumen');

      if (resumen) {
        resumen.textContent =
          'Composición Matrícula todavía no contiene datos.';
      }

      if (estado) {
        estado.textContent =
          'Puede cargar composicion_matricula.csv desde “Actualizar registros”. ' +
          (error && error.message ? error.message : String(error));
        estado.classList.add('error');
      }
    })
    .obtenerDataset('composicion_matricula');
}

function aplicarDatosComposicion_(respuesta){
  const resumen = document.getElementById('composicionResumen');
  const estado = document.getElementById('composicionEstado');

  cargarOpcionesFiltro_('filtroComposicionAno', respuesta.filtros.anos, 'Todos');
  cargarOpcionesFiltro_('filtroComposicionSede', respuesta.filtros.sedes, 'Todas');
  cargarOpcionesFiltro_('filtroComposicionJornada', respuesta.filtros.jornadas, 'Todas');
  cargarOpcionesFiltro_('filtroComposicionCarrera', respuesta.filtros.carreras, 'Todas');

  configurarFiltrosComposicion_();
  actualizarVisualizacionesComposicion_();
  mostrarDiscrepanciasComposicion_(respuesta.discrepanciasPrimerAno || []);

  if (resumen) {
    resumen.textContent =
      `${respuesta.cantidadRegistros.toLocaleString('es-CL')} registros · ` +
      `${respuesta.cantidadColumnas.toLocaleString('es-CL')} columnas · ${respuesta.archivoOficial}`;
  }

  if (estado) {
    estado.textContent = respuesta.cantidadRegistros > 0
      ? 'Dataset oficial cargado correctamente.'
      : 'El archivo existe, pero todavía no contiene registros de composición.';
    estado.classList.remove('error');
  }
}

function configurarFiltrosComposicion_(){
  [
    'filtroComposicionAno',
    'filtroComposicionSede',
    'filtroComposicionJornada',
    'filtroComposicionCarrera'
  ].forEach(function(id){
    const control = document.getElementById(id);
    if (!control || control.dataset.listenerConfigurado === '1') return;

    control.addEventListener('change', actualizarVisualizacionesComposicion_);
    control.dataset.listenerConfigurado = '1';
  });
}

function obtenerComposicionFiltrada_(){
  const registros = window.datasetCache.composicion_matricula || [];

  const ano = obtenerValorFiltro_('filtroComposicionAno');
  const sede = obtenerValorFiltro_('filtroComposicionSede');
  const jornada = obtenerValorFiltro_('filtroComposicionJornada');
  const carrera = obtenerValorFiltro_('filtroComposicionCarrera');

  return registros.filter(function(registro){
    return (!ano || String(registro.ANIO) === ano) &&
           (!sede || String(registro.SEDE) === sede) &&
           (!jornada || String(registro.JORNADA) === jornada) &&
           (!carrera || String(registro.CARRERA) === carrera);
  });
}

function actualizarVisualizacionesComposicion_(){
  const registros = obtenerComposicionFiltrada_();

  const primero = sumarCampoComposicion_(registros, 'PRIMER_ANIO');
  const segundo = sumarCampoComposicion_(registros, 'SEGUNDO_ANIO');
  const pt = sumarCampoComposicion_(registros, 'PROCESO_TITULACION');

  asignarTexto_('kpiComposicionPrimero', formatearNumero_(primero));
  asignarTexto_('kpiComposicionSegundo', formatearNumero_(segundo));
  asignarTexto_('kpiComposicionPT', formatearNumero_(pt));
  asignarTexto_('kpiComposicionTotal', formatearNumero_(primero + segundo + pt));

  dibujarBarras_(
    'graficoComposicionGeneral',
    [
      {etiqueta:'Primer año', valor:primero},
      {etiqueta:'Segundo año', valor:segundo},
      {etiqueta:'Proceso titulación', valor:pt}
    ],
    3
  );

  dibujarBarras_(
    'graficoComposicionPrimerAno',
    agregarComposicionPorAno_(registros, 'PRIMER_ANIO'),
    20
  );

  dibujarBarras_(
    'graficoComposicionSegundoAno',
    agregarComposicionPorAno_(registros, 'SEGUNDO_ANIO'),
    20
  );

  dibujarBarras_(
    'graficoComposicionPT',
    agregarComposicionPorAno_(registros, 'PROCESO_TITULACION'),
    20
  );
}

function sumarCampoComposicion_(registros, campo){
  return (registros || []).reduce(function(suma, registro){
    return suma + numeroGenerico_(registro[campo]);
  }, 0);
}

function agregarComposicionPorAno_(registros, campo){
  const mapa = {};

  (registros || []).forEach(function(registro){
    const ano = extraerAnoFrontend_(registro.ANIO);
    if (!ano) return;

    mapa[ano] =
      (mapa[ano] || 0) +
      numeroGenerico_(registro[campo]);
  });

  return Object.keys(mapa)
    .map(ano => ({etiqueta:ano, valor:mapa[ano]}))
    .sort((a,b) => Number(a.etiqueta) - Number(b.etiqueta));
}

function mostrarDiscrepanciasComposicion_(discrepancias){
  const box = document.getElementById('composicionDiscrepancias');
  if (!box) return;

  if (!discrepancias || discrepancias.length === 0) {
    box.hidden = true;
    box.innerHTML = '';
    return;
  }

  box.hidden = false;

  const primeras = discrepancias.slice(0, 8);

  box.innerHTML = `
    <div class="consistency-note-title">
      Diferencias detectadas con Matrícula (${discrepancias.length})
    </div>
    <div class="consistency-note-text">
      Para el indicador se mantienen los valores de composicion_matricula.csv.
      Matrícula se usa únicamente como fuente de contraste para Primer Año.
    </div>
    <ul>
      ${primeras.map(function(d){
        const jornada = d.jornada ? ` · ${escapeHtml_(d.jornada)}` : '';
        return `
          <li>
            ${escapeHtml_(d.anio)} · ${escapeHtml_(d.sede)}${jornada} ·
            ${escapeHtml_(d.carrera)}:
            Composición ${formatearNumero_(d.primerAnoComposicion)} /
            Matrícula ${formatearNumero_(d.primerAnoMatricula)}
          </li>`;
      }).join('')}
    </ul>
    ${discrepancias.length > primeras.length
      ? `<div class="consistency-note-text">
           Se muestran las primeras ${primeras.length} diferencias.
         </div>`
      : ''}
  `;
}

function cargarOfertaOficial_(){
  google.script.run
    .withSuccessHandler(function(respuesta){
      window.datasetCache.oferta = respuesta.registros;
      window.datasetMeta.oferta = {
        cantidadRegistros: respuesta.cantidadRegistros,
        cantidadColumnas: respuesta.cantidadColumnas,
        encabezados: respuesta.encabezados
      };

      aplicarDatosOferta_(respuesta);
    })
    .withFailureHandler(function(error){
      const estado = document.getElementById('ofertaEstado');
      const resumen = document.getElementById('ofertaResumen');

      if (resumen) {
        resumen.textContent = 'El dataset oficial debe actualizarse con la fuente SIES.';
      }

      if (estado) {
        estado.textContent =
          'Use “Actualizar registros” para cargar el CSV bruto de Oferta Académica. ' +
          (error && error.message ? error.message : String(error));
        estado.classList.add('error');
      }
    })
    .obtenerDataset('oferta');
}

function aplicarDatosOferta_(respuesta){
  const resumen = document.getElementById('ofertaResumen');
  const estado = document.getElementById('ofertaEstado');

  cargarOpcionesFiltroEtiquetadas_(
    'filtroOfertaAno',
    respuesta.filtros.anos,
    'Todos',
    valor => String(valor).replace(/^OFE_/, '')
  );

  cargarOpcionesFiltro_('filtroOfertaSede', respuesta.filtros.sedes, 'Todas');
  cargarOpcionesFiltro_('filtroOfertaArea', respuesta.filtros.areas, 'Todas');
  cargarOpcionesFiltro_('filtroOfertaCarrera', respuesta.filtros.carreras, 'Todas');
  cargarOpcionesFiltro_('filtroOfertaJornada', respuesta.filtros.jornadas, 'Todas');
  cargarOpcionesFiltro_('filtroOfertaVigencia', respuesta.filtros.vigencias, 'Todas');

  configurarFiltrosOferta_();
  actualizarVisualizacionesOferta_();

  if (resumen) {
    resumen.textContent =
      `${respuesta.cantidadRegistros.toLocaleString('es-CL')} registros · ` +
      `${respuesta.cantidadColumnas.toLocaleString('es-CL')} columnas · ${respuesta.archivoOficial}`;
  }

  if (estado) {
    estado.textContent = 'Dataset oficial cargado correctamente.';
    estado.classList.remove('error');
  }
}

function actualizarVisualizacionesOferta_(){
  const registros = obtenerOfertaFiltrada_();

  const vacantesTotal = registros.reduce(function(suma, registro){
    return suma +
      numeroGenerico_(registro['Vacantes Semestre Uno']) +
      numeroGenerico_(registro['Vacantes Semestre Dos']);
  }, 0);

  asignarTexto_('kpiOfertaVacantesTotal', formatearNumero_(vacantesTotal));

    agregarVacantesOfertaPorCampo_(registros, 'Nombre Carrera'),

  );
}

function agregarVacantesOfertaPorCampo_(registros, campo, limpiarAno){
  const mapa = {};

  registros.forEach(function(registro){
    let etiqueta = String(registro[campo] || '').trim();
    if (!etiqueta) return;

    if (limpiarAno) {
      etiqueta = etiqueta.replace(/^OFE_/, '');
    }

    const vacantes =
      numeroGenerico_(registro['Vacantes Semestre Uno']) +
      numeroGenerico_(registro['Vacantes Semestre Dos']);

    mapa[etiqueta] = (mapa[etiqueta] || 0) + vacantes;
  });

  const resultado = Object.keys(mapa)
    .map(etiqueta => ({ etiqueta, valor: mapa[etiqueta] }));

  if (limpiarAno) {
    return resultado.sort((a,b) => Number(a.etiqueta) - Number(b.etiqueta));
  }

  return resultado.sort((a,b) => b.valor - a.valor);
}

function aplicarDatosRetencion_(respuesta){
  const registros = respuesta.registros || [];
  const anos = [...new Set(
    registros
      .map(r => Number(extraerAnoFrontend_(r.ANIO)))
      .filter(Number.isFinite)
  )].sort((a,b) => a-b);

  const cohortes = anos.filter(ano => anos.includes(ano + 1));

  cargarOpcionesFiltro_(
    'filtroRetencionCohorte',
    cohortes.map(String),
    'Todas'
  );

  cargarOpcionesFiltro_(
    'filtroRetencionSede',
    [...new Set(registros.map(r => String(r.SEDE || '').trim()).filter(Boolean))].sort(),
    'Todas'
  );

  cargarOpcionesFiltro_(
    'filtroRetencionJornada',
    [...new Set(registros.map(r => String(r.JORNADA || '').trim()).filter(Boolean))].sort(),
    'Todas'
  );

  cargarOpcionesFiltroEtiquetadas_(
    'filtroRetencionCarrera',
    obtenerCarrerasNormalizadasRetencion_(registros),
    'Todas',
    valor => etiquetaCarreraRetencion_(valor)
  );

  actualizarVisualizacionesRetencion_();

function obtenerFiltrosRetencion_(){
  return {
    cohorte: obtenerValorFiltro_('filtroRetencionCohorte'),
    sede: obtenerValorFiltro_('filtroRetencionSede'),
    jornada: obtenerValorFiltro_('filtroRetencionJornada'),
    carrera: obtenerValorFiltro_('filtroRetencionCarrera')
  };
}

function obtenerCarrerasNormalizadasRetencion_(registros){
  return [...new Set(
    (registros || [])
      .map(r => normalizarCarreraRetencion_(r.CARRERA))
      .filter(Boolean)
  )].sort();
}

function normalizarCarreraRetencion_(valor){
  let texto = String(valor || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toUpperCase()
    .replace(/[.,;:()]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  // Regla general acordada: TNS = TÉCNICO DE NIVEL SUPERIOR.
  texto = texto.replace(/^TNS\s+/, 'TECNICO DE NIVEL SUPERIOR ');
  texto = texto.replace(/^TECNICO NIVEL SUPERIOR\s+/, 'TECNICO DE NIVEL SUPERIOR ');

  return texto;
}

function etiquetaCarreraRetencion_(valor){
  return String(valor || '')
    .replace(/^TECNICO DE NIVEL SUPERIOR /, 'TÉCNICO DE NIVEL SUPERIOR ');
}

function filtrarRegistrosRetencion_(registros, ano, filtros){
  return (registros || []).filter(function(registro){
    if (Number(extraerAnoFrontend_(registro.ANIO)) !== Number(ano)) {
      return false;
    }

    if (filtros.sede && String(registro.SEDE) !== filtros.sede) {
      return false;
    }

    if (filtros.jornada && String(registro.JORNADA) !== filtros.jornada) {
      return false;
    }

    if (
      filtros.carrera &&
      normalizarCarreraRetencion_(registro.CARRERA) !== filtros.carrera
    ) {
      return false;
    }

    return true;
  });
}

function calcularRetencionCohorte_(registros, cohorte, filtros){
  const primeroRegs = filtrarRegistrosRetencion_(registros, cohorte, filtros);
  const segundoRegs = filtrarRegistrosRetencion_(registros, cohorte + 1, filtros);

  const primero = sumarCampoComposicion_(primeroRegs, 'PRIMER_ANIO');
  const segundo = sumarCampoComposicion_(segundoRegs, 'SEGUNDO_ANIO');

  if (primero <= 0) {
    return null;
  }

  return {
    cohorte: cohorte,
    primero: primero,
    segundo: segundo,
    retencion: (segundo / primero) * 100
  };
}

function obtenerSeriesRetencion_(registros, filtros){
  const anos = [...new Set(
    (registros || [])
      .map(r => Number(extraerAnoFrontend_(r.ANIO)))
      .filter(Number.isFinite)
  )].sort((a,b) => a-b);

  return anos
    .filter(ano => anos.includes(ano + 1))
    .map(ano => calcularRetencionCohorte_(registros, ano, filtros))
    .filter(Boolean);
}

function actualizarVisualizacionesRetencion_(){
  const registros = window.datasetCache.retencion || [];
  const filtros = obtenerFiltrosRetencion_();

  let serie = obtenerSeriesRetencion_(registros, filtros);

  if (filtros.cohorte) {
    serie = serie.filter(
      item => String(item.cohorte) === String(filtros.cohorte)
    );
  }

  const primeroTotal = serie.reduce((suma, item) => suma + item.primero, 0);
  const segundoTotal = serie.reduce((suma, item) => suma + item.segundo, 0);
  const retencionTotal =
    primeroTotal > 0 ? (segundoTotal / primeroTotal) * 100 : null;

  asignarTexto_(
    'kpiRetencionPorcentaje',
    retencionTotal === null ? '—' : formatearPorcentaje_(retencionTotal)
  );
  asignarTexto_('kpiRetencionPrimero', formatearNumero_(primeroTotal));
  asignarTexto_('kpiRetencionSegundo', formatearNumero_(segundoTotal));
  asignarTexto_('kpiRetencionCohortes', formatearNumero_(serie.length));

  dibujarBarrasPorcentaje_(
    'graficoRetencionCohorte',
    serie.map(item => ({
      etiqueta:String(item.cohorte),
      valor:item.retencion
    }))
  );

  dibujarRetencionPorDimension_(
    'graficoRetencionSede',
    registros,
    filtros,
    'SEDE'
  );

  dibujarRetencionPorCarrera_(
    'graficoRetencionCarrera',
    registros,
    filtros
  );
}

function dibujarRetencionPorDimension_(id, registros, filtros, campo){
  const valores = [...new Set(
    (registros || [])
      .map(r => String(r[campo] || '').trim())
      .filter(Boolean)
  )].sort();

  const datos = valores.map(function(valor){
    const filtrosDimension = Object.assign({}, filtros);

    if (campo === 'SEDE') {
      filtrosDimension.sede = valor;
    }

    let serie = obtenerSeriesRetencion_(registros, filtrosDimension);

    if (filtros.cohorte) {
      serie = serie.filter(
        item => String(item.cohorte) === String(filtros.cohorte)
      );
    }

    const primero = serie.reduce((suma, item) => suma + item.primero, 0);
    const segundo = serie.reduce((suma, item) => suma + item.segundo, 0);

    return {
      etiqueta:valor,
      valor:primero > 0 ? (segundo / primero) * 100 : 0
    };
  }).filter(item => item.valor > 0);

  dibujarBarrasPorcentaje_(id, datos);
}

function dibujarRetencionPorCarrera_(id, registros, filtros){
  const carreras = obtenerCarrerasNormalizadasRetencion_(registros);

  const datos = carreras.map(function(carrera){
    const filtrosCarrera = Object.assign({}, filtros, {
      carrera:carrera
    });

    let serie = obtenerSeriesRetencion_(registros, filtrosCarrera);

    if (filtros.cohorte) {
      serie = serie.filter(
        item => String(item.cohorte) === String(filtros.cohorte)
      );
    }

    const primero = serie.reduce((suma, item) => suma + item.primero, 0);
    const segundo = serie.reduce((suma, item) => suma + item.segundo, 0);

    return {
      etiqueta:etiquetaCarreraRetencion_(carrera),
      valor:primero > 0 ? (segundo / primero) * 100 : 0
    };
  })
  .filter(item => item.valor > 0)
  .sort((a,b) => b.valor - a.valor)
  .slice(0,12);

  dibujarBarrasPorcentaje_(id, datos);
}

function dibujarBarrasPorcentaje_(id, datos){
  const contenedor = document.getElementById(id);
  if (!contenedor) return;

  const items = datos || [];

  if (!items.length) {
    contenedor.innerHTML =
      '<div class="chart-empty">No hay datos calculables para la selección actual.</div>';
    return;
  }

  const maximo = Math.max(...items.map(item => item.valor), 100);

  contenedor.innerHTML = items.map(function(item){
    const porcentaje = Math.max(
      2,
      Math.min(100, (item.valor / maximo) * 100)
    );

    return `
      <div class="bar-row">
        <div class="bar-label" title="${escapeHtml_(item.etiqueta)}">
          ${escapeHtml_(item.etiqueta)}
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${porcentaje.toFixed(2)}%"></div>
        </div>
        <div class="bar-value">${formatearPorcentaje_(item.valor)}</div>
      </div>
    `;
  }).join('');
}

function formatearPorcentaje_(valor){

function cargarTituladosOficial_(){
  google.script.run
    .withSuccessHandler(function(respuesta){
      window.datasetCache.titulados = respuesta.registros;
      window.datasetMeta.titulados = {
        cantidadRegistros: respuesta.cantidadRegistros,
        cantidadColumnas: respuesta.cantidadColumnas,
        encabezados: respuesta.encabezados
      };
      aplicarDatosTitulados_(respuesta);
    })
    .withFailureHandler(function(error){
      const estado = document.getElementById('tituladosEstado');
      const resumen = document.getElementById('tituladosResumen');

      if (resumen) resumen.textContent = 'No existe todavía un dataset oficial de Titulados.';
      if (estado) {
        estado.textContent =
          'Use “Actualizar registros” para cargar por primera vez titulados.csv. ' +
          (error && error.message ? error.message : String(error));
        estado.classList.add('error');
      }
    })
    .obtenerDataset('titulados');
}

function aplicarDatosTitulados_(respuesta){
  const resumen = document.getElementById('tituladosResumen');
  const estado = document.getElementById('tituladosEstado');

  cargarOpcionesFiltroEtiquetadas_(
    'filtroTituladosAno',
    respuesta.filtros.anos,
    'Todos',
    valor => String(valor).replace(/^TIT_/, '')
  );
  cargarOpcionesFiltro_('filtroTituladosSede', respuesta.filtros.sedes, 'Todas');
  cargarOpcionesFiltro_('filtroTituladosArea', respuesta.filtros.areas, 'Todas');
  cargarOpcionesFiltro_('filtroTituladosCarrera', respuesta.filtros.carreras, 'Todas');
  cargarOpcionesFiltro_('filtroTituladosJornada', respuesta.filtros.jornadas, 'Todas');

  configurarFiltrosTitulados_();
  actualizarVisualizacionesTitulados_();

  if (resumen) {
    resumen.textContent =
      `${respuesta.cantidadRegistros.toLocaleString('es-CL')} registros · ` +
      `${respuesta.cantidadColumnas.toLocaleString('es-CL')} columnas · ${respuesta.archivoOficial}`;
  }

  if (estado) {
    estado.textContent = 'Dataset oficial cargado correctamente.';
    estado.classList.remove('error');
  }
}

function configurarFiltrosTitulados_(){
  [
    'filtroTituladosAno',

    'filtroTituladosArea',
    'filtroTituladosCarrera',
    'filtroTituladosJornada'
  ].forEach(function(id){

    control.addEventListener('change', actualizarVisualizacionesTitulados_);

function obtenerFiltrosTitulados_(){
  return {

function sumarCampo_(registros, campo){
  return registros.reduce(function(suma, registro){
    return suma + numeroGenerico_(registro[campo]);
  }, 0);
}

function agregarPorCampoNumerico_(registros, campoAgrupar, campoValor, limpiarAno){
  const mapa = {};

  registros.forEach(function(registro){
    let etiqueta = String(registro[campoAgrupar] || '').trim();
    if (!etiqueta) return;

    if (limpiarAno) etiqueta = etiqueta.replace(/^TIT_/, '');

    mapa[etiqueta] = (mapa[etiqueta] || 0) + numeroGenerico_(registro[campoValor]);
  });

  const resultado = Object.keys(mapa)
    .map(etiqueta => ({ etiqueta, valor: mapa[etiqueta] }));

  if (limpiarAno) {
    return resultado.sort((a,b) => Number(a.etiqueta) - Number(b.etiqueta));
  }

  return resultado.sort((a,b) => b.valor - a.valor);
}

function numeroDecimal_(valor){
  const texto = String(valor === null || valor === undefined ? '' : valor)
    .trim()
    .replace(',', '.');

  const numero = Number(texto);
  return Number.isFinite(numero) ? numero : 0;
}

function sumarDotacionCampo_(registros, campo){
  return (registros || []).reduce(function(suma, registro){
    return suma + numeroDecimal_(registro[campo]);
  }, 0);
}

function promedioPonderadoDotacion_(registros){
  let sumaPonderada = 0;
  let peso = 0;

  (registros || []).forEach(function(registro){
    const jce = numeroDecimal_(registro.JCE_TOTAL);
    const edad = numeroDecimal_(registro.EDAD_PROMEDIO_TOTAL);

    if (jce > 0 && edad > 0) {
      sumaPonderada += edad * jce;
      peso += jce;
    }
  });

  return peso > 0 ? sumaPonderada / peso : 0;
}

      {
        etiqueta:'55 a 64',
        valor:sumarDotacionCampo_(registros,'JCE_MUJER_55_64') +
              sumarDotacionCampo_(registros,'JCE_HOMBRE_55_64')
      },
      {
        etiqueta:'65 o más',
        valor:sumarDotacionCampo_(registros,'JCE_MUJER_65_MAS') +
              sumarDotacionCampo_(registros,'JCE_HOMBRE_65_MAS')
      }
    ].filter(item => item.valor > 0)
  );
}

function formatearDecimal_(valor, decimales){
  return Number(valor || 0).toLocaleString(
    'es-CL',
    {
      minimumFractionDigits:decimales,
      maximumFractionDigits:decimales
    }
  );
}

function dibujarBarrasDecimal_(id, datos){
  const contenedor = document.getElementById(id);
  if (!contenedor) return;

  const items = datos || [];

  if (!items.length) {
    contenedor.innerHTML =
      '<div class="chart-empty">No hay datos para la selección actual.</div>';
    return;
  }

  const maximo = Math.max(...items.map(item => item.valor), 1);

  contenedor.innerHTML = items.map(function(item){
    const porcentaje = Math.max(2, (item.valor / maximo) * 100);

    return `
      <div class="bar-row">
        <div class="bar-label" title="${escapeHtml_(item.etiqueta)}">
          ${escapeHtml_(item.etiqueta)}
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${porcentaje.toFixed(2)}%"></div>
        </div>
        <div class="bar-value">${formatearDecimal_(item.valor, 1)}</div>
      </div>
    `;
  }).join('');
}

function cargarTasaTitulacion_(){
  google.script.run
    .withSuccessHandler(function(respuesta){
      window.datasetCache.tasa_titulacion = respuesta;
      aplicarDatosTasaTitulacion_(respuesta);
    })
    .withFailureHandler(function(error){
      const estado = document.getElementById('tasaTitulacionEstado');
      const resumen = document.getElementById('tasaTitulacionResumen');

      if (resumen) resumen.textContent = 'No fue posible calcular la tasa de titulación.';
      if (estado) {
        estado.textContent =
          'El indicador requiere Titulados y Composición matrícula con datos. ' +
          (error && error.message ? error.message : String(error));
        estado.classList.add('error');
      }
    })
    .obtenerDatosTasaTitulacion();
}

function aplicarDatosTasaTitulacion_(respuesta){
  const combinado = []
    .concat((respuesta.composicion || []).map(r => ({
      cohorte: extraerAnoFrontend_(r.ANIO),
      sede: normalizarSedeTasa_(r.SEDE),
      jornada: normalizarTextoTasa_(r.JORNADA),
      carrera: normalizarCarreraTasa_(r.CARRERA)
    })))
    .concat((respuesta.titulados || []).map(r => ({
      cohorte: String(Number(extraerAnoFrontend_(r['AÑO'])) - 2),
      sede: normalizarSedeTasa_(r['NOMBRE SEDE']),
      jornada: normalizarTextoTasa_(r['JORNADA']),
      carrera: normalizarCarreraTasa_(r['NOMBRE CARRERA'])
    })));

  cargarOpcionesFiltro_(
    'filtroTasaTitulacionCohorte',
    [...new Set(combinado.map(r => r.cohorte).filter(Boolean))]
      .sort((a,b)=>Number(a)-Number(b)),
    'Todas'
  );
  cargarOpcionesFiltro_(
    'filtroTasaTitulacionSede',
    [...new Set(combinado.map(r => r.sede).filter(Boolean))].sort(),
    'Todas'
  );
  cargarOpcionesFiltro_(
    'filtroTasaTitulacionJornada',
    [...new Set(combinado.map(r => r.jornada).filter(Boolean))].sort(),
    'Todas'
  );
  cargarOpcionesFiltroEtiquetadas_(
    'filtroTasaTitulacionCarrera',
    [...new Set(combinado.map(r => r.carrera).filter(Boolean))].sort(),
    'Todas',
    valor => etiquetaCarreraTasa_(valor)
  );

  [
    'filtroTasaTitulacionCohorte',
    'filtroTasaTitulacionSede',
    'filtroTasaTitulacionJornada',
    'filtroTasaTitulacionCarrera'
  ].forEach(function(id){
    const control = document.getElementById(id);
    if (!control || control.dataset.listenerConfigurado === '1') return;
    control.addEventListener('change', actualizarVisualizacionesTasaTitulacion_);
    control.dataset.listenerConfigurado = '1';
  });

  actualizarVisualizacionesTasaTitulacion_();

  const resumen = document.getElementById('tasaTitulacionResumen');
  const estado = document.getElementById('tasaTitulacionEstado');

  if (resumen) {
    resumen.textContent =
      'Indicador derivado desde titulados.csv y composicion_matricula.csv.';
  }
  if (estado) {
    estado.textContent =
      'Tasa de Titulación por cohorte aproximada (x−2). Conversión PT calculada por año calendario.';
    estado.classList.remove('error');
  }
}

function obtenerFiltrosTasaTitulacion_(){
  return {
    cohorte: obtenerValorFiltro_('filtroTasaTitulacionCohorte'),
    sede: obtenerValorFiltro_('filtroTasaTitulacionSede'),
    jornada: obtenerValorFiltro_('filtroTasaTitulacionJornada'),
    carrera: obtenerValorFiltro_('filtroTasaTitulacionCarrera')
  };
}

function normalizarTextoTasa_(valor){
  return String(valor || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toUpperCase()
    .replace(/\s+/g, ' ')
    .trim();
}

function normalizarSedeTasa_(valor){
  return normalizarTextoTasa_(valor).replace(/^SEDE\s+/, '');
}

function normalizarCarreraTasa_(valor){
  let texto = normalizarTextoTasa_(valor)
    .replace(/[.,;:()]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  texto = texto.replace(/^TNS\s+/, 'TECNICO DE NIVEL SUPERIOR ');
  texto = texto.replace(/^TECNICO NIVEL SUPERIOR\s+/, 'TECNICO DE NIVEL SUPERIOR ');

  return texto;
}

function etiquetaCarreraTasa_(valor){
  return String(valor || '')
    .replace(/^TECNICO DE NIVEL SUPERIOR /, 'TÉCNICO DE NIVEL SUPERIOR ');
}

function coincideDimensionTasa_(registro, fuente, filtros){
  let sede, jornada, carrera;

  if (fuente === 'titulados') {
    sede = normalizarSedeTasa_(registro['NOMBRE SEDE']);
    jornada = normalizarTextoTasa_(registro['JORNADA']);
    carrera = normalizarCarreraTasa_(registro['NOMBRE CARRERA']);
  } else {
    sede = normalizarSedeTasa_(registro.SEDE);
    jornada = normalizarTextoTasa_(registro.JORNADA);
    carrera = normalizarCarreraTasa_(registro.CARRERA);
  }

  return (!filtros.sede || sede === filtros.sede) &&
         (!filtros.jornada || jornada === filtros.jornada) &&
         (!filtros.carrera || carrera === filtros.carrera);
}

function calcularSeriesTasaTitulacion_(respuesta, filtros){
  const primeroPorCohorte = {};
  const ptPorAno = {};
  const tituladosPorAno = {};

  (respuesta.composicion || []).forEach(function(r){
    if (!coincideDimensionTasa_(r, 'composicion', filtros)) return;

    const ano = Number(extraerAnoFrontend_(r.ANIO));
    if (!Number.isFinite(ano)) return;

    primeroPorCohorte[ano] =
      (primeroPorCohorte[ano] || 0) + numeroGenerico_(r.PRIMER_ANIO);

    ptPorAno[ano] =
      (ptPorAno[ano] || 0) + numeroGenerico_(r.PROCESO_TITULACION);
  });

  (respuesta.titulados || []).forEach(function(r){
    if (!coincideDimensionTasa_(r, 'titulados', filtros)) return;

    const ano = Number(extraerAnoFrontend_(r['AÑO']));
    if (!Number.isFinite(ano)) return;

    tituladosPorAno[ano] =
      (tituladosPorAno[ano] || 0) + numeroGenerico_(r['TOTAL TITULACIONES']);
  });

  let cohortes = Object.keys(primeroPorCohorte)
    .map(Number)
    .sort((a,b)=>a-b);

  if (filtros.cohorte) {
    cohortes = cohortes.filter(c => String(c) === String(filtros.cohorte));
  }

  const tasa = cohortes.map(function(cohorte){
    const primerAno = primeroPorCohorte[cohorte] || 0;
    const anoTitulacion = cohorte + 2;
    const existeTitulacion = Object.prototype.hasOwnProperty.call(
      tituladosPorAno, anoTitulacion
    );
    const titulados = existeTitulacion ? tituladosPorAno[anoTitulacion] : 0;

    return {
      cohorte,
      anoTitulacion,
      primerAno,
      titulados,
      valor: primerAno > 0 && existeTitulacion
        ? (titulados / primerAno) * 100
        : null
    };
  });

  let anosPT = Object.keys(ptPorAno)
    .map(Number)
    .sort((a,b)=>a-b);

  if (filtros.cohorte) {
    anosPT = anosPT.filter(a => String(a) === String(filtros.cohorte));
  }

  const conversion = anosPT.map(function(ano){
    const pt = ptPorAno[ano] || 0;
    const existeTitulacion = Object.prototype.hasOwnProperty.call(
      tituladosPorAno, ano
    );
    const titulados = existeTitulacion ? tituladosPorAno[ano] : 0;

    return {
      ano,
      pt,
      titulados,
      valor: pt > 0 && existeTitulacion
        ? (titulados / pt) * 100
        : null
    };
  });

  return { tasa, conversion };
}

function actualizarVisualizacionesTasaTitulacion_(){
  const respuesta = window.datasetCache.tasa_titulacion || {
    titulados:[],
    composicion:[]
  };
  const filtros = obtenerFiltrosTasaTitulacion_();
  const series = calcularSeriesTasaTitulacion_(respuesta, filtros);

  const tasaValida = series.tasa.filter(i => i.valor !== null);
  const primerAno = tasaValida.reduce((s,i)=>s+i.primerAno,0);
  const tituladosAtribuidos = tasaValida.reduce((s,i)=>s+i.titulados,0);

  const conversionValida = series.conversion.filter(i => i.valor !== null);
  const pt = conversionValida.reduce((s,i)=>s+i.pt,0);
  const tituladosMismoAno = conversionValida.reduce((s,i)=>s+i.titulados,0);

  asignarTexto_(
    'kpiTasaTitulacion',
    primerAno > 0
      ? formatearPorcentaje_((tituladosAtribuidos/primerAno)*100)
      : '—'
  );
  asignarTexto_('kpiTasaPrimerAno', formatearNumero_(primerAno));
  asignarTexto_('kpiTasaTitulados', formatearNumero_(tituladosAtribuidos));
  asignarTexto_(
    'kpiConversionPTMatriculados',
    formatearNumero_(pt)
  );
  asignarTexto_(
    'kpiConversionPTTitulados',
    formatearNumero_(tituladosMismoAno)
  );
  asignarTexto_(
    'kpiConversionPT',
    pt > 0
      ? formatearPorcentaje_((tituladosMismoAno/pt)*100)
      : '—'
  );

  dibujarBarrasPorcentaje_(
    'graficoTasaTitulacionCohorte',
    tasaValida.map(i => ({
      etiqueta:String(i.cohorte),
      valor:i.valor
    }))
  );

  dibujarBarrasPorcentaje_(
    'graficoConversionPTAno',
    conversionValida.map(i => ({
      etiqueta:String(i.ano),
      valor:i.valor
    }))
  );
}
