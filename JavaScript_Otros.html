<script>

/** Resultados SIGA: visualización por año y semestre calendario. */

window.sigaState = window.sigaState || {
  ano:'', semestreCalendario:'', oferta:[], inscritos:[], resultados:[], composicion:[]
};

function renderResultadosSiga_(vista){
  const content=document.getElementById('tabContent');
  const esAplicacion=(vista||'aplicacion_siga')==='aplicacion_siga';

  content.innerHTML=`
    <main class="dataset-view siga-view">
      <div class="dataset-view-header">
        <div>
          <div class="dataset-view-title-row">
            <div class="dataset-view-title">${esAplicacion?'Aplicación SIGA':'Resultados académicos'}</div>
            <button type="button" class="download-link" id="sigaDescargarBtn" disabled>Descargar CSV</button>
            <button type="button" class="update-link" id="sigaActualizarBtn">↻ Cargar archivo SIGA</button>
          </div>
          <div class="dataset-view-subtitle">
            ${esAplicacion
              ? 'Cobertura y completitud de la aplicación SIGA para un período calendario específico.'
              : 'Indicadores académicos calculados desde los registros SIGA del período seleccionado.'}
          </div>
        </div>
      </div>

      <section class="filter-panel siga-period-panel">
        <div class="filter-panel-title">Período SIGA</div>
        <div class="filter-panel-help siga-period-help">
          Seleccione obligatoriamente el año calendario y el semestre calendario. No se muestran datos mientras el período no esté completo.
        </div>
        <div class="filter-grid siga-period-grid">
          <label class="filter-field siga-year-field">
            <span>Año calendario</span>
            <select id="sigaAno"><option value="">Seleccione año</option></select>
          </label>
          <label class="filter-field siga-year-field">
            <span>Semestre calendario</span>
            <select id="sigaSemestreCalendario" disabled>
              <option value="">Seleccione semestre</option>
              <option value="1">Semestre 1</option>
              <option value="2">Semestre 2</option>
            </select>
          </label>
        </div>
      </section>

      ${sigaUploadPanelHtml_()}

      <section id="sigaPeriodoPendiente" class="category-empty siga-period-empty">
        Seleccione año y semestre calendario para visualizar los datos SIGA.
      </section>

      <section id="sigaContenido" hidden>
        <section class="filter-panel siga-secondary-filters">
          <div class="filter-panel-title">Filtros de visualización</div>
          <div class="filter-grid siga-secondary-grid">
            <label class="filter-field"><span>Sede</span><select id="sigaSede" disabled><option value="">Todas</option></select></label>
            <label class="filter-field"><span>Carrera</span><select id="sigaCarrera" disabled><option value="">Todas</option></select></label>
            <label class="filter-field"><span>Jornada</span><select id="sigaJornada" disabled><option value="">Todas</option></select></label>
            <label class="filter-field"><span>Semestre curricular</span><select id="sigaSemestrePlan" disabled><option value="">Todos</option></select></label>
          </div>
        </section>
        ${esAplicacion?sigaAplicacionHtml_():sigaResultadosHtml_()}
      </section>

      <div class="siga-detail-overlay" id="sigaRamosDetalleOverlay" hidden><section class="siga-detail-modal" role="dialog" aria-modal="true" aria-labelledby="sigaRamosDetalleTitulo"><header class="siga-detail-modal-header"><div><div class="siga-section-kicker">DETALLE SIGA</div><h3 id="sigaRamosDetalleTitulo">Ramos evaluados</h3><div class="chart-subtitle" id="sigaRamosDetalleSubtitulo"></div></div><button type="button" class="siga-detail-close" id="sigaRamosDetalleCerrar" aria-label="Cerrar">×</button></header><div class="siga-detail-modal-body" id="sigaRamosDetalleBody"></div></section></div>
      <div class="dataset-status" id="sigaEstado">Seleccione año y semestre calendario.</div>
    </main>`;

  sigaConfigurarInterfaz_(esAplicacion);
  sigaCargarPeriodos_();
}

function sigaAplicacionHtml_(){
  return `<section class="siga-section">
    <div class="siga-section-heading"><div><div class="siga-section-kicker">APLICACIÓN SIGA</div><h2>Avance de aplicación</h2><p>Datos de cobertura y completitud del registro para el período seleccionado.</p></div></div>
    <section class="kpi-grid siga-kpi-grid">
      ${sigaKpiHtml_('sigaKpiRamos','Ramos evaluados','dato','Cantidad de ramos distintos evaluados en SIGA. Un ramo corresponde a una combinación única de sede, carrera, jornada y asignatura.')}
      ${sigaKpiHtml_('sigaKpiAlumnos','Alumnos inscritos en SIGA','dato','Cantidad de estudiantes distintos inscritos para rendir evaluaciones en el archivo SIGA cargado.')}
      ${sigaKpiHtml_('sigaKpiEsperados','Registros esperados','calculo','Cálculo realizado sobre los alumnos inscritos en SIGA. En semestre calendario 1, los alumnos de primer año consideran 5 ramos y los demás 6. En semestre calendario 2, todos consideran 6 ramos.')}
      ${sigaKpiHtml_('sigaKpiProcesados','Registros procesados','dato','Cantidad efectiva de registros contenidos en el CSV de resultados SIGA para el período y filtros seleccionados.')}
    </section>
    <section class="charts-grid siga-charts-implementacion">
      <article class="chart-card chart-card-wide siga-ramos-card">
        <div class="chart-title">Ramos evaluados por curso</div>
        <div class="chart-subtitle">Cantidad de ramos evaluados. Haga clic en el número para ver el detalle.</div>
        <div id="sigaRamosCurso" class="siga-ramos-table-wrap"></div>
      </article>
    </section>
    <section class="siga-discrepancy" id="sigaDiscrepancy" hidden>
      <div class="siga-discrepancy-header">
        <div>
          <div class="chart-title">Observaciones de consistencia</div>
          <div class="chart-subtitle">Comparación entre estudiantes inscritos en SIGA y Composición de Matrícula.</div>
        </div>
        <button type="button" class="update-link" id="sigaDiscrepancyToggle">Ocultar</button>
      </div>
      <div id="sigaDiscrepancyBody"></div>
    </section>
  </section>`;
}

function sigaResultadosHtml_(){
  return `<section class="siga-section">
    <div class="siga-section-heading"><div><div class="siga-section-kicker">RESULTADOS SIGA</div><h2>Resultados académicos</h2><p>Indicadores de desempeño académico del período seleccionado.</p></div></div>
    <section class="kpi-grid siga-kpi-grid">
      ${sigaKpiHtml_('sigaKpiPromedio','Promedio final','calculo','Promedio de las notas finales disponibles. Los resultados pendientes sin nota final no se incluyen.')}
      ${sigaKpiHtml_('sigaKpiAprobacion','Aprobación','calculo','Porcentaje de registros con nota final igual o superior a 4,0 sobre el total de registros procesados.')}
      ${sigaKpiHtml_('sigaKpiReprobacion','Reprobación','calculo','Porcentaje de registros con nota final inferior a 4,0. Corresponde a ramos reprobados, no a personas.')}
      ${sigaKpiHtml_('sigaKpiPendientes','Resultados pendientes','calculo','Porcentaje de registros sin resultado final cerrado sobre el total de registros procesados.')}
    </section>
    <section class="charts-grid">
      <article class="chart-card"><div class="chart-title">Promedio final por carrera</div><div class="chart-subtitle">Promedio de notas finales por carrera.</div><div id="sigaPromedioCarreras" class="bar-chart siga-bar-chart"></div></article>
      <article class="chart-card"><div class="chart-title">Promedio final por sede</div><div class="chart-subtitle">Promedio de notas finales por sede.</div><div id="sigaPromedioSedes" class="bar-chart"></div></article>
    </section>
  </section>`;
}

function sigaKpiHtml_(id,titulo,tipo,ayuda){
  const esCalculo = tipo === 'calculo';
  return `<article class="kpi-card siga-kpi-card ${esCalculo ? 'kpi-type-calc' : 'kpi-type-data'}">
    <div class="kpi-card-header">
      <div class="kpi-label kpi-title-with-info">${escapeHtml_(titulo)}
        <span class="kpi-info-icon" tabindex="0">i<span class="kpi-info-tooltip">${escapeHtml_(ayuda)}</span></span>
      </div>
      <span class="kpi-type-badge ${esCalculo ? 'calc' : 'data'}">${esCalculo ? 'ƒx CALCULADO' : 'DATO'}</span>
    </div>
    <div class="kpi-value" id="${id}">—</div>
    <div class="kpi-note" id="${id}Nota">—</div>
  </article>`;
}

function sigaUploadPanelHtml_(){
  return `<section class="siga-upload-panel" id="sigaUploadPanel" hidden>
    <div class="upload-panel-header">
      <div class="upload-panel-title">Cargar archivo original de SIGA</div>
      <div class="upload-panel-help">
        El archivo debe identificar explícitamente el año calendario y si corresponde al semestre calendario 1 o 2. El original se conserva en la carpeta SIGA antes de procesarlo.
      </div>
    </div>
    <div class="siga-upload-meta">
      <label class="filter-field"><span>Año calendario</span><input id="sigaUploadAno" type="number" min="2020" max="2099" placeholder="2026"></label>
      <label class="filter-field"><span>Semestre calendario</span><select id="sigaUploadSemestre"><option value="">Seleccione</option><option value="1">Semestre 1</option><option value="2">Semestre 2</option></select></label>
    </div>
    <div class="siga-upload-row siga-upload-xlsx-row">
      <div><strong>Archivo XLSX exportado por SIGA</strong><div class="upload-panel-help">Se conservará el original y se generarán los CSV de ramos ofrecidos y resultados del período.</div></div>
      <input type="file" id="sigaXlsxFile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      <button type="button" id="sigaXlsxUploadBtn">Cargar y procesar</button>
    </div>
    <div class="upload-panel-status" id="sigaUploadStatus"></div>
  </section>`;
}

function sigaConfigurarInterfaz_(esAplicacion){
  const actualizar=document.getElementById('sigaActualizarBtn');
  const panel=document.getElementById('sigaUploadPanel');
  if(actualizar&&panel) actualizar.addEventListener('click',()=>{panel.hidden=!panel.hidden;});

  const descargar=document.getElementById('sigaDescargarBtn');
  if(descargar) descargar.addEventListener('click',()=>sigaDescargarCsv_(esAplicacion?'siga_oferta':'siga_resultados'));

  const ano=document.getElementById('sigaAno');
  const sem=document.getElementById('sigaSemestreCalendario');
  if(ano) ano.addEventListener('change',()=>sigaCambioAno_(ano.value));
  if(sem) sem.addEventListener('change',sigaSeleccionarPeriodo_);

  ['sigaSede','sigaCarrera','sigaJornada','sigaSemestrePlan'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.addEventListener('change',sigaActualizarVista_);
  });

  const subir=document.getElementById('sigaXlsxUploadBtn');
  if(subir) subir.addEventListener('click',sigaSubirXlsx_);
  const cerrarDetalle=document.getElementById('sigaRamosDetalleCerrar');
  const overlayDetalle=document.getElementById('sigaRamosDetalleOverlay');
  if(cerrarDetalle) cerrarDetalle.addEventListener('click',sigaCerrarDetalleRamos_);
  if(overlayDetalle) overlayDetalle.addEventListener('click',e=>{if(e.target===overlayDetalle)sigaCerrarDetalleRamos_();});

  const discrepToggle=document.getElementById('sigaDiscrepancyToggle');
  if(discrepToggle) discrepToggle.addEventListener('click',sigaToggleDiscrepancias_);
}

function sigaCargarPeriodos_(){
  google.script.run
    .withSuccessHandler(function(items){
      window.sigaState.periodos=items||[];
      const select=document.getElementById('sigaAno');
      if(!select)return;
      const anos=[...new Set((items||[]).map(x=>String(x.ano)))].sort((a,b)=>Number(b)-Number(a));
      select.innerHTML='<option value="">Seleccione año</option>'+anos.map(a=>`<option value="${escapeHtml_(a)}">${escapeHtml_(a)}</option>`).join('');
    })
    .withFailureHandler(sigaMostrarError_)
    .obtenerPeriodosSiga();
}

function sigaCambioAno_(ano){
  window.sigaState.ano=ano||'';
  window.sigaState.semestreCalendario='';
  const sem=document.getElementById('sigaSemestreCalendario');
  if(sem){
    sem.value='';
    sem.disabled=!ano;
    const disponibles=new Set((window.sigaState.periodos||[]).filter(x=>String(x.ano)===String(ano)).map(x=>String(x.semestre)));
    [...sem.options].forEach(o=>{if(o.value)o.disabled=!disponibles.has(o.value);});
  }
  sigaOcultarContenido_('Seleccione año y semestre calendario.');
}

function sigaSeleccionarPeriodo_(){
  const ano=String(document.getElementById('sigaAno')?.value||'');
  const sem=String(document.getElementById('sigaSemestreCalendario')?.value||'');
  window.sigaState.ano=ano;
  window.sigaState.semestreCalendario=sem;

  if(!ano||!sem){sigaOcultarContenido_('Seleccione año y semestre calendario.');return;}

  sigaSetEstado_(`Cargando SIGA ${ano}-${sem}...`);
  window.sigaState.oferta=[]; window.sigaState.inscritos=[]; window.sigaState.resultados=[]; window.sigaState.composicion=[];
  let pendientes=4;
  let huboError=false;
  const fin=()=>{
    pendientes--;
    if(pendientes!==0)return;
    if(huboError){sigaOcultarContenido_(`No fue posible cargar completamente SIGA ${ano}-${sem}.`);return;}
    sigaMostrarContenido_();
    sigaPrepararFiltros_();
    sigaActualizarVista_();
    sigaSetEstado_(`SIGA ${ano}-${sem} cargado correctamente.`);
    const d=document.getElementById('sigaDescargarBtn'); if(d)d.disabled=false;
  };

  google.script.run.withSuccessHandler(r=>{window.sigaState.oferta=r.registros||[];fin();}).withFailureHandler(e=>{huboError=true;sigaMostrarError_(e);fin();}).obtenerDatasetSiga('siga_oferta',ano,sem);
  google.script.run.withSuccessHandler(r=>{window.sigaState.inscritos=r.registros||[];fin();}).withFailureHandler(e=>{huboError=true;sigaMostrarError_(e);fin();}).obtenerDatasetSiga('siga_inscritos',ano,sem);
  google.script.run.withSuccessHandler(r=>{window.sigaState.resultados=r.registros||[];fin();}).withFailureHandler(e=>{huboError=true;sigaMostrarError_(e);fin();}).obtenerDatasetSiga('siga_resultados',ano,sem);
  google.script.run.withSuccessHandler(r=>{window.sigaState.composicion=r.registros||[];fin();}).withFailureHandler(e=>{window.sigaState.composicion=[];console.warn(e);fin();}).obtenerDataset('composicion_matricula');
}

function sigaOcultarContenido_(mensaje){
  const c=document.getElementById('sigaContenido'); if(c)c.hidden=true;
  const p=document.getElementById('sigaPeriodoPendiente'); if(p)p.hidden=false;
  const d=document.getElementById('sigaDescargarBtn'); if(d)d.disabled=true;
  sigaSetEstado_(mensaje||'Seleccione año y semestre calendario.');
}

function sigaMostrarContenido_(){
  const c=document.getElementById('sigaContenido'); if(c)c.hidden=false;
  const p=document.getElementById('sigaPeriodoPendiente'); if(p)p.hidden=true;
}

function sigaPrepararFiltros_(){
  const base=[...(window.sigaState.oferta||[]),...(window.sigaState.inscritos||[]),...(window.sigaState.resultados||[])];
  sigaLlenarSelect_('sigaSede',base.map(r=>r.SEDE),'Todas las sedes');
  sigaLlenarSelect_('sigaCarrera',base.map(r=>r.CARRERA),'Todas las carreras');
  sigaLlenarSelect_('sigaJornada',base.map(r=>r.JORNADA),'Todas las jornadas');
  sigaLlenarSelect_('sigaSemestrePlan',base.map(r=>r.SEMESTRE_PLAN),'Todos');
  ['sigaSede','sigaCarrera','sigaJornada','sigaSemestrePlan'].forEach(id=>{const x=document.getElementById(id);if(x)x.disabled=false;});
}

function sigaLlenarSelect_(id,valores,etiqueta){
  const s=document.getElementById(id); if(!s)return; const actual=s.value;
  const unicos=[...new Set((valores||[]).filter(Boolean).map(String))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
  s.innerHTML=`<option value="">${etiqueta}</option>`+unicos.map(v=>`<option value="${escapeHtml_(v)}">${escapeHtml_(v)}</option>`).join('');
  if([...s.options].some(o=>o.value===actual))s.value=actual;
}

function sigaFiltros_(){return {sede:obtenerValorFiltro_('sigaSede'),carrera:obtenerValorFiltro_('sigaCarrera'),jornada:obtenerValorFiltro_('sigaJornada'),semestrePlan:obtenerValorFiltro_('sigaSemestrePlan')};}
function sigaNorm_(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();}
function sigaCoincide_(r,f){return (!f.sede||sigaNorm_(r.SEDE)===sigaNorm_(f.sede))&&(!f.carrera||sigaNorm_(r.CARRERA)===sigaNorm_(f.carrera))&&(!f.jornada||sigaNorm_(r.JORNADA)===sigaNorm_(f.jornada))&&(!f.semestrePlan||String(r.SEMESTRE_PLAN)===String(f.semestrePlan));}

function sigaActualizarVista_(){
  if(!window.sigaState.ano||!window.sigaState.semestreCalendario)return;
  const f=sigaFiltros_();
  const oferta=(window.sigaState.oferta||[]).filter(r=>sigaCoincide_(r,f));
  const inscritos=(window.sigaState.inscritos||[]).filter(r=>sigaCoincide_(r,f));
  const resultados=(window.sigaState.resultados||[]).filter(r=>sigaCoincide_(r,f));
  sigaActualizarAplicacion_(oferta,inscritos,resultados,f);
  sigaActualizarResultados_(resultados);
}

function sigaActualizarAplicacion_(oferta,inscritos,resultados,f){
  const ramos=sigaContarRamosEvaluadosFront_(oferta);
  const alumnos=sigaContarAlumnosInscritosFront_(inscritos);
  const esperados=sigaCalcularEsperadosDesdeInscritos_(inscritos);

  asignarTexto_('sigaKpiRamos',formatearNumero_(ramos));
  asignarTexto_('sigaKpiRamosNota',`${formatearNumero_(ramos)} combinaciones únicas sede + carrera + jornada + asignatura`);

  asignarTexto_('sigaKpiAlumnos',formatearNumero_(alumnos));
  asignarTexto_('sigaKpiAlumnosNota',`${formatearNumero_(alumnos)} estudiantes distintos inscritos en el archivo SIGA`);

  asignarTexto_('sigaKpiEsperados',formatearNumero_(esperados.total));
  asignarTexto_('sigaKpiEsperadosNota',esperados.nota);

  asignarTexto_('sigaKpiProcesados',formatearNumero_(resultados.length));
  asignarTexto_('sigaKpiProcesadosNota','Registros efectivamente procesados desde SIGA');

  sigaDibujarRamosCurso_(oferta);
  sigaActualizarDiscrepancias_(alumnos,f);
}

function sigaContarRamosEvaluadosFront_(rows){
  const vistos=new Set();
  (rows||[]).forEach(r=>{
    const clave=[r.SEDE,r.CARRERA,r.JORNADA,r.ASIGNATURA].map(sigaNorm_).join('|');
    if(clave.replace(/\|/g,'')) vistos.add(clave);
  });
  return vistos.size;
}

function sigaContarAlumnosInscritosFront_(rows){
  return new Set((rows||[]).map(r=>String(r.ALUMNO_ID||'').trim()).filter(Boolean)).size;
}

function sigaCalcularEsperadosDesdeInscritos_(rows){
  const porAlumno={};
  (rows||[]).forEach(r=>{
    const id=String(r.ALUMNO_ID||'').trim();
    if(!id)return;
    const semPlan=Number(r.SEMESTRE_PLAN)||0;
    if(!porAlumno[id]) porAlumno[id]={primerAno:true};
    if(semPlan>=3) porAlumno[id].primerAno=false;
  });

  const totalAlumnos=Object.keys(porAlumno).length;
  const sem=String(window.sigaState.semestreCalendario||'');
  if(sem==='2'){
    return {
      total:totalAlumnos*6,
      nota:`${formatearNumero_(totalAlumnos)} alumnos × 6 ramos`
    };
  }

  let primero=0,otros=0;
  Object.values(porAlumno).forEach(x=>x.primerAno?primero++:otros++);
  return {
    total:primero*5+otros*6,
    nota:`${formatearNumero_(primero)} de primer año × 5 + ${formatearNumero_(otros)} restantes × 6`
  };
}

function sigaActualizarDiscrepancias_(alumnosSiga,f){
  const panel=document.getElementById('sigaDiscrepancy');
  const body=document.getElementById('sigaDiscrepancyBody');
  const toggle=document.getElementById('sigaDiscrepancyToggle');
  if(!panel||!body)return;

  const comp=sigaComposicionSeleccion_(f);
  if(!comp.disponible){
    panel.hidden=true;
    return;
  }

  const alumnosMatricula=comp.primero+comp.segundo;
  const diferencia=alumnosSiga-alumnosMatricula;
  if(diferencia===0){
    panel.hidden=true;
    return;
  }

  panel.hidden=false;
  body.hidden=false;
  if(toggle) toggle.textContent='Ocultar';
  const signo=diferencia>0?'+':'';
  body.innerHTML=`
    <div class="siga-discrepancy-item">
      <strong>Diferencia en estudiantes inscritos</strong>
      <span>SIGA registra ${formatearNumero_(alumnosSiga)} estudiantes distintos y Composición de Matrícula registra ${formatearNumero_(alumnosMatricula)} estudiantes de primer y segundo año para la misma selección. Diferencia: ${signo}${formatearNumero_(diferencia)}.</span>
    </div>`;
}

function sigaToggleDiscrepancias_(){
  const body=document.getElementById('sigaDiscrepancyBody');
  const toggle=document.getElementById('sigaDiscrepancyToggle');
  if(!body||!toggle)return;
  body.hidden=!body.hidden;
  toggle.textContent=body.hidden?'Mostrar':'Ocultar';
}

function sigaComposicionSeleccion_(f){
  const ano=String(window.sigaState.ano||'');
  const rows=(window.sigaState.composicion||[]).filter(r=>String(r.ANIO)===ano && (!f.sede||sigaNorm_(r.SEDE)===sigaNorm_(f.sede)) && (!f.carrera||sigaNorm_(r.CARRERA)===sigaNorm_(f.carrera)) && (!f.jornada||sigaNorm_(r.JORNADA)===sigaNorm_(f.jornada)));
  if(!rows.length)return {disponible:false,primero:0,segundo:0};
  return rows.reduce((acc,r)=>{
    acc.primero+=numeroGenerico_(r.PRIMER_ANIO);
    acc.segundo+=numeroGenerico_(r.SEGUNDO_ANIO);
    return acc;
  },{disponible:true,primero:0,segundo:0});
}


function sigaActualizarResultados_(rows){
  const total=rows.length; let aprob=0,reprob=0,pend=0,suma=0,nNotas=0;
  rows.forEach(r=>{const n=sigaNumeroFront_(r.PROMEDIO_FINAL),sit=String(r.SITUACION||'').toUpperCase(); if(sit==='PENDIENTE'||n===null){pend++;return;} n>=4?aprob++:reprob++; suma+=n;nNotas++;});
  const promedio=nNotas?suma/nNotas:null;
  const pct=n=>total?100*n/total:0;
  asignarTexto_('sigaKpiPromedio',promedio===null?'—':promedio.toFixed(1).replace('.',',')); asignarTexto_('sigaKpiPromedioNota',`${formatearNumero_(nNotas)} registros considerados`);
  asignarTexto_('sigaKpiAprobacion',`${pct(aprob).toFixed(1).replace('.',',')}%`); asignarTexto_('sigaKpiAprobacionNota',`${formatearNumero_(aprob)} registros aprobados de ${formatearNumero_(total)}`);
  asignarTexto_('sigaKpiReprobacion',`${pct(reprob).toFixed(1).replace('.',',')}%`); asignarTexto_('sigaKpiReprobacionNota',`${formatearNumero_(reprob)} registros reprobados de ${formatearNumero_(total)}`);
  asignarTexto_('sigaKpiPendientes',`${pct(pend).toFixed(1).replace('.',',')}%`); asignarTexto_('sigaKpiPendientesNota',`${formatearNumero_(pend)} registros pendientes de ${formatearNumero_(total)}`);
  sigaDibujarPromedio_('sigaPromedioCarreras',rows,'CARRERA'); sigaDibujarPromedio_('sigaPromedioSedes',rows,'SEDE');
}

function sigaNumeroFront_(v){const t=String(v??'').trim().replace(',','.');if(!t)return null;const n=Number(t);return Number.isFinite(n)?n:null;}
function sigaEtiquetaCorta_(t){return String(t||'').replace(/^TÉCNICO DE NIVEL SUPERIOR EN /i,'').replace(/^Técnico de Nivel Superior en /i,'').replace(/^TÉCNICO DE NIVEL SUPERIOR /i,'').replace(/^Técnico de Nivel Superior /i,'');}
function sigaNombreCursoRegistro_(r){return [sigaEtiquetaCorta_(r.CARRERA),r.SEMESTRE_PLAN?`Sem. ${r.SEMESTRE_PLAN}`:'',r.JORNADA,r.SEDE].filter(Boolean).join(' · ');}
function sigaDibujarRamosCurso_(rows){const cont=document.getElementById('sigaRamosCurso');if(!cont)return;const m={};(rows||[]).forEach(r=>{const k=r.ID_CURSO||sigaNombreCursoRegistro_(r);if(!m[k])m[k]={r:r,ramos:new Set()};m[k].ramos.add(sigaNorm_(r.ASIGNATURA));});const d=Object.entries(m).map(([id,x])=>({id,etiqueta:sigaNombreCursoRegistro_(x.r),valor:x.ramos.size})).sort((a,b)=>a.etiqueta.localeCompare(b.etiqueta,'es'));if(!d.length){cont.innerHTML='<div class="chart-empty">No hay datos para la selección actual.</div>';return;}cont.innerHTML=`<table class="siga-ramos-table"><thead><tr><th>Curso</th><th>Ramos evaluados</th></tr></thead><tbody>${d.map(x=>`<tr><td>${escapeHtml_(x.etiqueta)}</td><td class="siga-ramos-count-cell"><button type="button" class="siga-ramos-count-link" data-siga-curso="${escapeHtml_(x.id)}">${formatearNumero_(x.valor)}</button></td></tr>`).join('')}</tbody></table>`;cont.querySelectorAll('.siga-ramos-count-link').forEach(btn=>btn.addEventListener('click',()=>sigaAbrirDetalleRamos_(btn.dataset.sigaCurso)));}
function sigaAbrirDetalleRamos_(idCurso){const overlay=document.getElementById('sigaRamosDetalleOverlay'),titulo=document.getElementById('sigaRamosDetalleTitulo'),subtitulo=document.getElementById('sigaRamosDetalleSubtitulo'),body=document.getElementById('sigaRamosDetalleBody');if(!overlay||!titulo||!body)return;const f=sigaFiltros_();const oferta=(window.sigaState.oferta||[]).filter(r=>sigaCoincide_(r,f)&&String(r.ID_CURSO||sigaNombreCursoRegistro_(r))===String(idCurso));const inscritos=(window.sigaState.inscritos||[]).filter(r=>sigaCoincide_(r,f)&&String(r.ID_CURSO||sigaNombreCursoRegistro_(r))===String(idCurso));const ref=oferta[0]||inscritos[0]||null,curso=ref?sigaNombreCursoRegistro_(ref):String(idCurso||'');const alumnos=new Set(inscritos.map(r=>String(r.ALUMNO_ID||'').trim()).filter(Boolean)).size;const ramos=[...new Set(oferta.map(r=>String(r.ASIGNATURA||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));titulo.textContent='Ramos evaluados';if(subtitulo)subtitulo.textContent=curso;body.innerHTML=ramos.length?`<div class="siga-modal-summary">${formatearNumero_(ramos.length)} ramos evaluados · ${formatearNumero_(alumnos)} alumnos inscritos en el curso</div><div class="siga-modal-table-wrap"><table class="siga-modal-table"><thead><tr><th>Ramo</th><th>Alumnos</th></tr></thead><tbody>${ramos.map(r=>`<tr><td>${escapeHtml_(r)}</td><td>${formatearNumero_(alumnos)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="chart-empty">No hay ramos disponibles para este curso.</div>';overlay.hidden=false;}
function sigaCerrarDetalleRamos_(){const overlay=document.getElementById('sigaRamosDetalleOverlay');if(overlay)overlay.hidden=true;}
function sigaDibujarPromedio_(id,rows,campo){const m={};rows.forEach(r=>{const n=sigaNumeroFront_(r.PROMEDIO_FINAL);if(n===null||String(r.SITUACION||'').toUpperCase()==='PENDIENTE')return;const k=r[campo]||'Sin información';m[k]=m[k]||{s:0,n:0};m[k].s+=n;m[k].n++;});const d=Object.entries(m).map(([k,v])=>({etiqueta:sigaEtiquetaCorta_(k),valor:v.n?v.s/v.n:0})).sort((a,b)=>b.valor-a.valor);sigaDibujarBarrasNota_(id,d);}
function sigaDibujarBarrasNota_(id,datos){const c=document.getElementById(id);if(!c)return;if(!datos.length){c.innerHTML='<div class="chart-empty">No hay datos para la selección actual.</div>';return;}c.innerHTML=datos.map(d=>{const w=Math.max(2,Math.min(100,d.valor/7*100));return `<div class="bar-row"><div class="bar-label" title="${escapeHtml_(d.etiqueta)}">${escapeHtml_(d.etiqueta)}</div><div class="bar-track"><div class="bar-fill" style="width:${w.toFixed(1)}%"></div></div><div class="bar-value">${d.valor.toFixed(1).replace('.',',')}</div></div>`;}).join('');}

function sigaSubirXlsx_(){
  const ano=String(document.getElementById('sigaUploadAno')?.value||'').trim();
  const sem=String(document.getElementById('sigaUploadSemestre')?.value||'').trim();
  const input=document.getElementById('sigaXlsxFile');
  const estado=document.getElementById('sigaUploadStatus');

  if(!/^20\d{2}$/.test(ano)){if(estado)estado.textContent='Indique un año calendario válido.';return;}
  if(!['1','2'].includes(sem)){if(estado)estado.textContent='Seleccione semestre calendario 1 o 2.';return;}
  if(!input?.files?.length){if(estado)estado.textContent='Seleccione el archivo XLSX exportado por SIGA.';return;}

  const file=input.files[0];
  if(!file.name.toLowerCase().endsWith('.xlsx')){if(estado)estado.textContent='El archivo debe estar en formato XLSX.';return;}
  if(estado)estado.textContent='Guardando original y procesando '+file.name+'...';

  const reader=new FileReader();
  reader.onload=e=>{
    const dataUrl=String(e.target.result||'');
    const base64=dataUrl.includes(',')?dataUrl.split(',')[1]:'';
    google.script.run
      .withSuccessHandler(r=>{
        if(estado)estado.textContent=`Proceso correcto: ${r.ramosEvaluados.toLocaleString('es-CL')} ramos evaluados, ${r.alumnosInscritos.toLocaleString('es-CL')} alumnos inscritos y ${r.registrosProcesados.toLocaleString('es-CL')} registros procesados para ${r.periodo}.`;
        input.value='';
        sigaCargarPeriodos_();
        setTimeout(()=>{
          const a=document.getElementById('sigaAno'); const s=document.getElementById('sigaSemestreCalendario');
          if(a){a.value=ano;sigaCambioAno_(ano);}
          if(s){s.value=sem;s.disabled=false;sigaSeleccionarPeriodo_();}
        },150);
      })
      .withFailureHandler(err=>{if(estado)estado.textContent='Error: '+(err?.message||String(err));})
      .procesarArchivoSigaXlsx(ano,sem,base64,file.name,file.type);
  };
  reader.readAsDataURL(file);
}

function sigaDescargarCsv_(tipo){
  const ano=window.sigaState.ano, sem=window.sigaState.semestreCalendario;
  if(!ano||!sem)return;
  google.script.run.withSuccessHandler(r=>{if(!r?.disponible)return;const blob=new Blob(['\uFEFF'+r.contenido],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=r.archivo;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}).obtenerCsvSigaDescarga(tipo,ano,sem);
}
function sigaSetEstado_(txt){const e=document.getElementById('sigaEstado');if(e){e.textContent=txt;e.classList.remove('error');}}
function sigaMostrarError_(err){const e=document.getElementById('sigaEstado');if(e){e.textContent='Error SIGA: '+(err?.message||String(err));e.classList.add('error');}console.error(err);}

</script>
