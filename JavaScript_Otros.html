<script>

/** Resultados SIGA: visualización anual basada en CSV normalizados. */

window.sigaState = window.sigaState || {
  ano:'', oferta:[], resultados:[], composicion:[], cargando:false
};

function renderResultadosSiga_(vista){
  const content=document.getElementById('tabContent');
  const esAplicacion=(vista||'aplicacion_siga')==='aplicacion_siga';

  content.innerHTML=`
    <main class="dataset-view siga-view">
      <div class="dataset-view-header">
        <div>
          <div class="dataset-view-title-row">
            <div class="dataset-view-title">${esAplicacion?'Aplicación SIGA':'Resultados académicos'}</div>
            <button type="button" class="download-link" id="sigaDescargarBtn" disabled>Descargar CSV</button>
            <button type="button" class="update-link" id="sigaActualizarBtn">↻ Actualizar registros</button>
          </div>
          <div class="dataset-view-subtitle">
            ${esAplicacion
              ? 'Cobertura esperada y registros disponibles para la aplicación del instrumento.'
              : 'Indicadores de desempeño académico consolidados una vez aplicado el instrumento.'}
          </div>
        </div>
      </div>

      <section class="filter-panel siga-year-panel">
        <div class="filter-panel-title">Seleccione el año antes de cargar resultados</div>
        <div class="filter-grid siga-filter-grid">
          <label class="filter-field siga-year-field"><span>Año</span><select id="sigaAno"><option value="">Seleccione un año</option></select></label>
          <label class="filter-field"><span>Sede</span><select id="sigaSede" disabled><option value="">Todas</option></select></label>
          <label class="filter-field"><span>Carrera</span><select id="sigaCarrera" disabled><option value="">Todas</option></select></label>
          <label class="filter-field"><span>Jornada</span><select id="sigaJornada" disabled><option value="">Todas</option></select></label>
          <label class="filter-field"><span>Semestre</span><select id="sigaSemestre" disabled><option value="">Todos</option></select></label>
        </div>
      </section>

      ${sigaUploadPanelHtml_()}

      <section id="sigaContenido" class="siga-content-disabled">
        ${esAplicacion?sigaAplicacionHtml_():sigaResultadosHtml_()}
      </section>

      <div class="dataset-status" id="sigaEstado">Seleccione un año para cargar los datasets SIGA.</div>
    </main>`;

  sigaConfigurarInterfaz_(esAplicacion);
  sigaCargarAnios_();
}

function sigaAplicacionHtml_(){
  return `<section class="siga-section">
    <div class="siga-section-heading"><div><div class="siga-section-kicker">APLICACIÓN SIGA</div><h2>Avance de aplicación</h2><p>Datos de cobertura y completitud del registro para el año seleccionado.</p></div></div>
    <section class="kpi-grid siga-kpi-grid">
      ${sigaKpiHtml_('sigaKpiRamos','Cantidad de ramos ofrecidos','dato','Cantidad de filas del CSV de ramos ofrecidos luego de aplicar los filtros seleccionados.')}
      ${sigaKpiHtml_('sigaKpiAlumnos','Alumnos cursando','dato','Cantidad de estudiantes de primer o segundo año obtenida desde Composición de matrícula, según el semestre seleccionado.')}
      ${sigaKpiHtml_('sigaKpiEsperados','Registros esperados','calculo','Multiplicación entre la cantidad de ramos ofrecidos y la cantidad de alumnos cursando para la selección actual.')}
      ${sigaKpiHtml_('sigaKpiProcesados','Registros procesados','dato','Cantidad de registros contenidos en el CSV de resultados SIGA para la selección actual.')}
    </section>
    <section class="charts-grid">
      <article class="chart-card chart-card-wide"><div class="chart-title">Ramos ofrecidos por curso</div><div class="chart-subtitle">Cantidad de asignaturas incluidas en el instrumento según curso.</div><div id="sigaRamosCurso" class="bar-chart siga-bar-chart"></div></article>
    </section>
  </section>`;
}

function sigaResultadosHtml_(){
  return `<section class="siga-section">
    <div class="siga-section-heading"><div><div class="siga-section-kicker">RESULTADOS SIGA</div><h2>Resultados académicos</h2><p>Indicadores de desempeño académico consolidados una vez aplicado el instrumento.</p></div></div>
    <section class="kpi-grid siga-kpi-grid">
      ${sigaKpiHtml_('sigaKpiPromedio','Promedio final','calculo','Promedio de las notas finales disponibles. Los resultados pendientes sin nota final no se incluyen en este promedio.')}
      ${sigaKpiHtml_('sigaKpiAprobacion','Aprobación','calculo','Porcentaje de registros con nota final igual o superior a 4,0 sobre el total de registros procesados del CSV.')}
      ${sigaKpiHtml_('sigaKpiReprobacion','Reprobación','calculo','Porcentaje de registros con nota final inferior a 4,0. Corresponde a ramos reprobados, no a personas.')}
      ${sigaKpiHtml_('sigaKpiPendientes','Resultados pendientes','calculo','Porcentaje de registros sin resultado final cerrado sobre el total de registros procesados del CSV.')}
    </section>
    <section class="charts-grid">
      <article class="chart-card"><div class="chart-title">Promedio final por carrera</div><div class="chart-subtitle">Promedio de notas finales por carrera.</div><div id="sigaPromedioCarreras" class="bar-chart siga-bar-chart"></div></article>
      <article class="chart-card"><div class="chart-title">Promedio final por sede</div><div class="chart-subtitle">Promedio de notas finales por sede.</div><div id="sigaPromedioSedes" class="bar-chart"></div></article>
    </section>
  </section>`;
}

function sigaKpiHtml_(id,titulo,tipo,ayuda){
  return `<article class="kpi-card siga-kpi-card">
    <div class="siga-kpi-header">
      <div class="kpi-label siga-kpi-title">${escapeHtml_(titulo)}
        <span class="siga-info-icon" tabindex="0">i<span class="siga-info-tooltip">${escapeHtml_(ayuda)}</span></span>
      </div>
      <span class="siga-source-badge ${tipo==='calculo'?'siga-source-calc':'siga-source-data'}">${tipo==='calculo'?'CÁLCULO':'DATO'}</span>
    </div>
    <div class="kpi-value" id="${id}">—</div>
    <div class="kpi-note" id="${id}Nota">Seleccione un año</div>
  </article>`;
}

function sigaUploadPanelHtml_(){
  return `<section class="siga-upload-panel" id="sigaUploadPanel" hidden>
    <div class="upload-panel-header"><div class="upload-panel-title">Actualizar datasets SIGA</div><div class="upload-panel-help">Los CSV se almacenan separados por año. El año indicado debe coincidir con el contenido del archivo.</div></div>
    <div class="siga-upload-year"><label class="filter-field"><span>Año de carga</span><input id="sigaUploadAno" type="number" min="2020" max="2099" placeholder="2026"></label></div>
    <div class="siga-upload-row"><div><strong>Ramos ofrecidos</strong><div class="upload-panel-help">Una fila por asignatura ofrecida en cada curso.</div></div><input type="file" id="sigaOfertaFile" accept=".csv,text/csv"><button type="button" id="sigaOfertaUploadBtn">Cargar CSV</button></div>
    <div class="siga-upload-row"><div><strong>Resultados SIGA</strong><div class="upload-panel-help">Una fila por resultado de asignatura. El CSV publicado no contiene nombre ni RUT.</div></div><input type="file" id="sigaResultadosFile" accept=".csv,text/csv"><button type="button" id="sigaResultadosUploadBtn">Cargar CSV</button></div>
    <div class="upload-panel-status" id="sigaUploadStatus"></div>
  </section>`;
}

function sigaConfigurarInterfaz_(esAplicacion){
  const actualizar=document.getElementById('sigaActualizarBtn');
  const panel=document.getElementById('sigaUploadPanel');
  if(actualizar&&panel) actualizar.addEventListener('click',()=>{panel.hidden=!panel.hidden;});

  const descargar=document.getElementById('sigaDescargarBtn');
  if(descargar) descargar.addEventListener('click',()=>sigaDescargarCsv_(esAplicacion?'siga_oferta':'siga_resultados'));

  const ano=document.getElementById('sigaAno');
  if(ano) ano.addEventListener('change',()=>sigaSeleccionarAno_(ano.value));

  ['sigaSede','sigaCarrera','sigaJornada','sigaSemestre'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.addEventListener('change',sigaActualizarVista_);
  });

  const b1=document.getElementById('sigaOfertaUploadBtn');
  const b2=document.getElementById('sigaResultadosUploadBtn');
  if(b1) b1.addEventListener('click',()=>sigaSubirCsv_('siga_oferta','sigaOfertaFile'));
  if(b2) b2.addEventListener('click',()=>sigaSubirCsv_('siga_resultados','sigaResultadosFile'));
}

function sigaCargarAnios_(){
  google.script.run.withSuccessHandler(function(items){
    const select=document.getElementById('sigaAno'); if(!select)return;
    select.innerHTML='<option value="">Seleccione un año</option>'+(items||[]).map(x=>`<option value="${escapeHtml_(x.ano)}">${escapeHtml_(x.ano)}</option>`).join('');
    if(window.sigaState.ano && [...select.options].some(o=>o.value===window.sigaState.ano)){ select.value=window.sigaState.ano; sigaSeleccionarAno_(window.sigaState.ano); }
  }).withFailureHandler(sigaMostrarError_).obtenerAniosSiga();
}

function sigaSeleccionarAno_(ano){
  window.sigaState.ano=ano||'';
  const content=document.getElementById('sigaContenido');
  if(!ano){ if(content)content.classList.add('siga-content-disabled'); sigaSetEstado_('Seleccione un año para cargar los datasets SIGA.'); return; }
  if(content)content.classList.remove('siga-content-disabled');
  sigaSetEstado_('Cargando datasets SIGA '+ano+'...');
  window.sigaState.oferta=[]; window.sigaState.resultados=[]; window.sigaState.composicion=[];

  let pendientes=3;
  const fin=()=>{pendientes--; if(pendientes===0){sigaPrepararFiltros_(); sigaActualizarVista_(); sigaSetEstado_('Datasets SIGA '+ano+' cargados correctamente.'); const d=document.getElementById('sigaDescargarBtn'); if(d)d.disabled=false;}};

  google.script.run.withSuccessHandler(r=>{window.sigaState.oferta=r.registros||[];fin();}).withFailureHandler(e=>{sigaMostrarError_(e);fin();}).obtenerDatasetSiga('siga_oferta',ano);
  google.script.run.withSuccessHandler(r=>{window.sigaState.resultados=r.registros||[];fin();}).withFailureHandler(e=>{sigaMostrarError_(e);fin();}).obtenerDatasetSiga('siga_resultados',ano);
  google.script.run.withSuccessHandler(r=>{window.sigaState.composicion=r.registros||[];fin();}).withFailureHandler(e=>{window.sigaState.composicion=[];console.warn(e);fin();}).obtenerDataset('composicion_matricula');
}

function sigaPrepararFiltros_(){
  const base=[...(window.sigaState.oferta||[]),...(window.sigaState.resultados||[])];
  sigaLlenarSelect_('sigaSede',base.map(r=>r.SEDE),'Todas las sedes');
  sigaLlenarSelect_('sigaCarrera',base.map(r=>r.CARRERA),'Todas las carreras');
  sigaLlenarSelect_('sigaJornada',base.map(r=>r.JORNADA),'Todas las jornadas');
  sigaLlenarSelect_('sigaSemestre',base.map(r=>r.SEMESTRE),'Todos los semestres');
  ['sigaSede','sigaCarrera','sigaJornada','sigaSemestre'].forEach(id=>{const x=document.getElementById(id);if(x)x.disabled=false;});
}

function sigaLlenarSelect_(id,valores,etiqueta){
  const s=document.getElementById(id); if(!s)return; const actual=s.value;
  const unicos=[...new Set((valores||[]).filter(Boolean).map(String))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
  s.innerHTML=`<option value="">${etiqueta}</option>`+unicos.map(v=>`<option value="${escapeHtml_(v)}">${escapeHtml_(v)}</option>`).join('');
  if([...s.options].some(o=>o.value===actual))s.value=actual;
}

function sigaFiltros_(){return {sede:obtenerValorFiltro_('sigaSede'),carrera:obtenerValorFiltro_('sigaCarrera'),jornada:obtenerValorFiltro_('sigaJornada'),semestre:obtenerValorFiltro_('sigaSemestre')};}
function sigaNorm_(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();}
function sigaCoincide_(r,f){return (!f.sede||sigaNorm_(r.SEDE)===sigaNorm_(f.sede))&&(!f.carrera||sigaNorm_(r.CARRERA)===sigaNorm_(f.carrera))&&(!f.jornada||sigaNorm_(r.JORNADA)===sigaNorm_(f.jornada))&&(!f.semestre||String(r.SEMESTRE)===String(f.semestre));}

function sigaActualizarVista_(){
  if(!window.sigaState.ano)return;
  const f=sigaFiltros_();
  const oferta=(window.sigaState.oferta||[]).filter(r=>sigaCoincide_(r,f));
  const resultados=(window.sigaState.resultados||[]).filter(r=>sigaCoincide_(r,f));
  sigaActualizarAplicacion_(oferta,resultados,f);
  sigaActualizarResultados_(resultados);
}

function sigaActualizarAplicacion_(oferta,resultados,f){
  const ramos=oferta.length;
  const composicion=sigaAlumnosComposicion_(f);
  const alumnos=composicion.disponible?composicion.valor:null;
  const esperados=alumnos===null?null:ramos*alumnos;
  asignarTexto_('sigaKpiRamos',formatearNumero_(ramos)); asignarTexto_('sigaKpiRamosNota',`${formatearNumero_(ramos)} filas del CSV de ramos`);
  asignarTexto_('sigaKpiAlumnos',alumnos===null?'—':formatearNumero_(alumnos)); asignarTexto_('sigaKpiAlumnosNota',alumnos===null?'Composición de matrícula no tiene datos para este año':'Dato desde Composición de matrícula');
  asignarTexto_('sigaKpiEsperados',esperados===null?'—':formatearNumero_(esperados)); asignarTexto_('sigaKpiEsperadosNota',esperados===null?'Requiere datos de Composición de matrícula':`${formatearNumero_(ramos)} × ${formatearNumero_(alumnos)}`);
  asignarTexto_('sigaKpiProcesados',formatearNumero_(resultados.length)); asignarTexto_('sigaKpiProcesadosNota','Filas del CSV de resultados SIGA');
  sigaDibujarRamosCurso_(oferta);
}

function sigaAlumnosComposicion_(f){
  const ano=String(window.sigaState.ano||'');
  const rows=(window.sigaState.composicion||[]).filter(r=>String(r.ANIO)===ano && (!f.sede||sigaNorm_(r.SEDE)===sigaNorm_(f.sede)) && (!f.carrera||sigaNorm_(r.CARRERA)===sigaNorm_(f.carrera)) && (!f.jornada||sigaNorm_(r.JORNADA)===sigaNorm_(f.jornada)));
  if(!rows.length)return {disponible:false,valor:null};
  const sem=Number(f.semestre||0);
  const valor=rows.reduce((s,r)=>{
    const primero=numeroGenerico_(r.PRIMER_ANIO), segundo=numeroGenerico_(r.SEGUNDO_ANIO);
    if(sem===1||sem===2)return s+primero;
    if(sem===3||sem===4)return s+segundo;
    return s+primero+segundo;
  },0);
  return {disponible:true,valor};
}

function sigaActualizarResultados_(rows){
  const total=rows.length; let aprob=0,reprob=0,pend=0,suma=0,nNotas=0;
  rows.forEach(r=>{const n=sigaNumeroFront_(r.PROMEDIO_FINAL),sit=String(r.SITUACION||'').toUpperCase(); if(sit==='PENDIENTE'||n===null){pend++;return;} n>=4?aprob++:reprob++; suma+=n;nNotas++;});
  const promedio=nNotas?suma/nNotas:null;
  const pct=n=>total?100*n/total:0;
  asignarTexto_('sigaKpiPromedio',promedio===null?'—':promedio.toFixed(1).replace('.',',')); asignarTexto_('sigaKpiPromedioNota',`${formatearNumero_(nNotas)} registros considerados`);
  asignarTexto_('sigaKpiAprobacion',`${pct(aprob).toFixed(1).replace('.',',')}%`); asignarTexto_('sigaKpiAprobacionNota',`${formatearNumero_(aprob)} registros aprobados de ${formatearNumero_(total)}`);
  asignarTexto_('sigaKpiReprobacion',`${pct(reprob).toFixed(1).replace('.',',')}%`); asignarTexto_('sigaKpiReprobacionNota',`${formatearNumero_(reprob)} registros reprobados de ${formatearNumero_(total)}`);
  asignarTexto_('sigaKpiPendientes',`${pct(pend).toFixed(1).replace('.',',')}%`); asignarTexto_('sigaKpiPendientesNota',`${formatearNumero_(pend)} registros pendientes de ${formatearNumero_(total)}`);
  sigaDibujarPromedio_('sigaPromedioCarreras',rows,'CARRERA'); sigaDibujarPromedio_('sigaPromedioSedes',rows,'SEDE');
}

function sigaNumeroFront_(v){const t=String(v??'').trim().replace(',','.');if(!t)return null;const n=Number(t);return Number.isFinite(n)?n:null;}
function sigaEtiquetaCorta_(t){return String(t||'').replace(/^TÉCNICO DE NIVEL SUPERIOR EN /i,'').replace(/^Técnico de Nivel Superior en /i,'').replace(/^TÉCNICO DE NIVEL SUPERIOR /i,'').replace(/^Técnico de Nivel Superior /i,'');}
function sigaNombreCursoRegistro_(r){return [sigaEtiquetaCorta_(r.CARRERA),r.SEMESTRE?`Sem. ${r.SEMESTRE}`:'',r.JORNADA,r.SEDE].filter(Boolean).join(' · ');}
function sigaDibujarRamosCurso_(rows){const m={};rows.forEach(r=>{const k=r.ID_CURSO||sigaNombreCursoRegistro_(r);if(!m[k])m[k]={r:r,n:0};m[k].n++;});const d=Object.values(m).map(x=>({etiqueta:sigaNombreCursoRegistro_(x.r),valor:x.n})).sort((a,b)=>b.valor-a.valor);dibujarBarras_('sigaRamosCurso',d,30);}
function sigaDibujarPromedio_(id,rows,campo){const m={};rows.forEach(r=>{const n=sigaNumeroFront_(r.PROMEDIO_FINAL);if(n===null||String(r.SITUACION||'').toUpperCase()==='PENDIENTE')return;const k=r[campo]||'Sin información';m[k]=m[k]||{s:0,n:0};m[k].s+=n;m[k].n++;});const d=Object.entries(m).map(([k,v])=>({etiqueta:sigaEtiquetaCorta_(k),valor:v.n?v.s/v.n:0})).sort((a,b)=>b.valor-a.valor);sigaDibujarBarrasNota_(id,d);}
function sigaDibujarBarrasNota_(id,datos){const c=document.getElementById(id);if(!c)return;if(!datos.length){c.innerHTML='<div class="chart-empty">No hay datos para la selección actual.</div>';return;}c.innerHTML=datos.map(d=>{const w=Math.max(2,Math.min(100,d.valor/7*100));return `<div class="bar-row"><div class="bar-label" title="${escapeHtml_(d.etiqueta)}">${escapeHtml_(d.etiqueta)}</div><div class="bar-track"><div class="bar-fill" style="width:${w.toFixed(1)}%"></div></div><div class="bar-value">${d.valor.toFixed(1).replace('.',',')}</div></div>`;}).join('');}

function sigaSubirCsv_(tipo,inputId){
  const ano=String(document.getElementById('sigaUploadAno')?.value||'').trim(); const input=document.getElementById(inputId); const estado=document.getElementById('sigaUploadStatus');
  if(!/^20\d{2}$/.test(ano)){if(estado)estado.textContent='Indique primero el año de carga.';return;}
  if(!input?.files?.length){if(estado)estado.textContent='Seleccione un archivo CSV.';return;}
  const file=input.files[0]; if(!file.name.toLowerCase().endsWith('.csv')){if(estado)estado.textContent='El archivo debe ser CSV.';return;}
  if(estado)estado.textContent='Leyendo y validando '+file.name+'...'; const reader=new FileReader();
  reader.onload=e=>google.script.run.withSuccessHandler(r=>{if(estado)estado.textContent=`Carga correcta: ${r.cantidadRegistros.toLocaleString('es-CL')} registros en ${r.archivoOficial}.`;input.value='';sigaCargarAnios_();const s=document.getElementById('sigaAno');if(s){setTimeout(()=>{s.value=ano;s.dispatchEvent(new Event('change'));},100);}}).withFailureHandler(err=>{if(estado)estado.textContent='Error: '+(err?.message||String(err));}).actualizarDatasetSiga(tipo,ano,e.target.result,file.name);
  reader.readAsText(file,'UTF-8');
}

function sigaDescargarCsv_(tipo){const ano=window.sigaState.ano;if(!ano)return;google.script.run.withSuccessHandler(r=>{if(!r?.disponible)return;const blob=new Blob(['\uFEFF'+r.contenido],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=r.archivo;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}).obtenerCsvSigaDescarga(tipo,ano);}
function sigaSetEstado_(txt){const e=document.getElementById('sigaEstado');if(e){e.textContent=txt;e.classList.remove('error');}}
function sigaMostrarError_(err){const e=document.getElementById('sigaEstado');if(e){e.textContent='Error SIGA: '+(err?.message||String(err));e.classList.add('error');}console.error(err);}

</script>
