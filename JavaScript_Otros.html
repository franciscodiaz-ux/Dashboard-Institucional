function renderResultadosSiga_(){
  const content = document.getElementById('tabContent');
  if (!content) return;

  content.innerHTML = `
    <main class="dataset-view siga-view">
      <div class="dataset-view-header">
        <div>
          <div class="dataset-view-title-row">
            <div class="dataset-view-title">Resultados SIGA · Seguimiento Académico</div>
          </div>
          <div class="dataset-view-subtitle">
            Seguimiento agregado del semestre ${escapeHtml_(SIGA_DATA.periodo)} · Sin datos personales de estudiantes.
          </div>
        </div>
      </div>

      <section class="filter-panel">
        <div class="filter-panel-title">Filtros</div>
        <div class="filter-grid siga-filter-grid">
          ${sigaSelectHtml_('sigaSede','Sede')}
          ${sigaSelectHtml_('sigaCarrera','Carrera')}
          ${sigaSelectHtml_('sigaJornada','Jornada')}
          ${sigaSelectHtml_('sigaSemestre','Semestre')}
          ${sigaSelectHtml_('sigaCurso','Curso')}
        </div>
      </section>

      <section class="kpi-grid siga-kpi-grid">
        ${sigaKpiHtml_('sigaKpiMatriculados','Matriculados')}
        ${sigaKpiHtml_('sigaKpiEvaluados','Evaluados')}
        ${sigaKpiHtml_('sigaKpiCobertura','Cobertura SIGA')}
        ${sigaKpiHtml_('sigaKpiPromedio','Promedio final')}
        ${sigaKpiHtml_('sigaKpiAprobacion','Aprobación')}
      </section>

      <section class="charts-grid">
        <article class="chart-card">
          <div class="chart-title">Cobertura de evaluación por curso</div>
          <div class="chart-subtitle">Estudiantes con resultados SIGA respecto de la matrícula vigente.</div>
          <div id="sigaCoberturaCursos" class="bar-chart siga-bar-chart"></div>
        </article>

        <article class="chart-card">
          <div class="chart-title">Promedio final por carrera</div>
          <div class="chart-subtitle">Promedio ponderado por registros de asignatura.</div>
          <div id="sigaPromedioCarreras" class="bar-chart siga-bar-chart"></div>
        </article>

        <article class="chart-card">
          <div class="chart-title">Promedio final por sede</div>
          <div class="chart-subtitle">Comparación del desempeño académico agregado.</div>
          <div id="sigaPromedioSedes" class="bar-chart"></div>
        </article>

        <article class="chart-card">
          <div class="chart-title">Situación académica</div>
          <div class="chart-subtitle">Distribución de resultados de asignatura.</div>
          <div id="sigaSituacion" class="siga-status-grid"></div>
        </article>

        <article class="chart-card chart-card-wide">
          <div class="chart-title">Detalle por asignatura</div>
          <div class="chart-subtitle">Resultados agregados según los filtros seleccionados.</div>
          <div class="siga-table-wrap">
            <table class="siga-table">
              <thead>
                <tr>
                  <th>Curso</th>
                  <th>Asignatura</th>
                  <th>Evaluaciones</th>
                  <th>Promedio</th>
                  <th>Aprobados</th>
                  <th>Reprobados</th>
                  <th>Pendientes</th>
                </tr>
              </thead>
              <tbody id="sigaDetalleAsignaturas"></tbody>
            </table>
          </div>
        </article>
      </section>

      <div class="dataset-status">
        Fuente institucional: SIGA/ESI ${escapeHtml_(SIGA_DATA.periodo)}. La vista presenta únicamente resultados agregados.
      </div>
    </main>
  `;

  sigaConfigurarFiltros_();
  sigaAplicarFiltros_();
}

function sigaSelectHtml_(id, label){
  return `
    <label class="filter-field">
      <span>${label}</span>
      <select id="${id}"><option value="">Todos</option></select>
    </label>`;
}

  return `
    <article class="kpi-card">
      <div class="kpi-label">${label}</div>
      <div class="kpi-value" id="${id}">—</div>
      <div class="kpi-note" id="${id}Nota"></div>
    </article>`;
}

function sigaUnicos_(valores){
  return [...new Set((valores || []).filter(Boolean))]
    .sort((a,b) => String(a).localeCompare(String(b),'es',{numeric:true}));
}

function sigaLlenarSelect_(id, valores, etiqueta){
  const select = document.getElementById(id);
  if (!select) return;
  const actual = select.value;
  select.innerHTML = `<option value="">${etiqueta}</option>` +
    sigaUnicos_(valores).map(v => `<option value="${escapeHtml_(v)}">${escapeHtml_(v)}</option>`).join('');
  if ([...select.options].some(o => o.value === actual)) select.value = actual;
}

function sigaConfigurarFiltros_(){
  const cursos = SIGA_DATA.cursos || [];
  sigaLlenarSelect_('sigaSede', cursos.map(r=>r.sede), 'Todas las sedes');
  sigaLlenarSelect_('sigaCarrera', cursos.map(r=>r.carrera), 'Todas las carreras');
  sigaLlenarSelect_('sigaJornada', cursos.map(r=>r.jornada), 'Todas las jornadas');
  sigaLlenarSelect_('sigaSemestre', cursos.map(r=>r.semestre), 'Todos los semestres');
  sigaLlenarSelect_('sigaCurso', cursos.map(r=>r.idCurso), 'Todos los cursos');

  ['sigaSede','sigaCarrera','sigaJornada','sigaSemestre','sigaCurso'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', sigaAplicarFiltros_);
  });
}

function sigaFiltrosActuales_(){
  return {
    sede: obtenerValorFiltro_('sigaSede'),
    carrera: obtenerValorFiltro_('sigaCarrera'),
    jornada: obtenerValorFiltro_('sigaJornada'),
    semestre: obtenerValorFiltro_('sigaSemestre'),
    idCurso: obtenerValorFiltro_('sigaCurso')
  };
}

function sigaCoincide_(r, f){
  return (!f.sede || r.sede === f.sede) &&
    (!f.carrera || r.carrera === f.carrera) &&
    (!f.jornada || r.jornada === f.jornada) &&
    (!f.semestre || String(r.semestre) === String(f.semestre)) &&
    (!f.idCurso || r.idCurso === f.idCurso);
}

function sigaAplicarFiltros_(){
  const f = sigaFiltrosActuales_();
  const cursos = (SIGA_DATA.cursos || []).filter(r => sigaCoincide_(r,f));
  const asignaturas = (SIGA_DATA.asignaturas || []).filter(r => sigaCoincide_(r,f));

  const matriculados = cursos.reduce((s,r)=>s+r.matriculados,0);
  const evaluados = cursos.reduce((s,r)=>s+r.evaluados,0);
  const cobertura = matriculados ? evaluados / matriculados * 100 : 0;
  const registros = cursos.reduce((s,r)=>s+r.registros,0);
  const promedio = registros
    ? cursos.reduce((s,r)=>s+((r.promedio || 0)*r.registros),0) / registros
    : 0;
  const aprobados = cursos.reduce((s,r)=>s+r.aprobados,0);
  const reprobados = cursos.reduce((s,r)=>s+r.reprobados,0);
  const pendientes = cursos.reduce((s,r)=>s+r.pendientes,0);
  const totalSituacion = aprobados + reprobados + pendientes;
  const aprobacion = totalSituacion ? aprobados / totalSituacion * 100 : 0;

  asignarTexto_('sigaKpiMatriculados', formatearNumero_(matriculados));
  asignarTexto_('sigaKpiMatriculadosNota', `${cursos.length} curso${cursos.length===1?'':'s'} seleccionado${cursos.length===1?'':'s'}`);
  asignarTexto_('sigaKpiEvaluados', formatearNumero_(evaluados));
  asignarTexto_('sigaKpiEvaluadosNota', 'Estudiantes con resultados publicados');
  asignarTexto_('sigaKpiCobertura', `${cobertura.toFixed(1).replace('.',',')}%`);
  asignarTexto_('sigaKpiCoberturaNota', `${formatearNumero_(evaluados)} de ${formatearNumero_(matriculados)} estudiantes`);
  asignarTexto_('sigaKpiPromedio', promedio ? promedio.toFixed(2).replace('.',',') : '—');
  asignarTexto_('sigaKpiPromedioNota', `${formatearNumero_(registros)} resultados de asignatura`);
  asignarTexto_('sigaKpiAprobacion', `${aprobacion.toFixed(1).replace('.',',')}%`);
  asignarTexto_('sigaKpiAprobacionNota', `${formatearNumero_(aprobados)} aprobados · ${formatearNumero_(reprobados)} reprobados`);

  sigaDibujarCobertura_(cursos);
  sigaDibujarPromediosCarrera_(cursos);
  sigaDibujarPromediosSede_(cursos);
  sigaDibujarSituacion_(aprobados,reprobados,pendientes);
  sigaDibujarTabla_(asignaturas);
}

function sigaDibujarCobertura_(cursos){
  const datos = cursos
    .map(r => ({etiqueta:r.idCurso, valor:r.cobertura}))
    .sort((a,b)=>b.valor-a.valor);

  sigaDibujarBarrasPorcentaje_('sigaCoberturaCursos',datos);
}

function sigaAgruparPromedio_(cursos,campo){
  const grupos = {};
  cursos.forEach(r => {
    const clave = r[campo] || 'Sin información';
    if (!grupos[clave]) grupos[clave] = {suma:0,peso:0};
    grupos[clave].suma += (r.promedio || 0) * r.registros;
    grupos[clave].peso += r.registros;
  });

  return Object.entries(grupos)
    .map(([etiqueta,g]) => ({
      etiqueta: sigaEtiquetaCorta_(etiqueta),
      valor: g.peso ? g.suma/g.peso : 0
    }))
    .sort((a,b)=>b.valor-a.valor);
}

function sigaDibujarPromediosCarrera_(cursos){
  sigaDibujarBarrasNota_('sigaPromedioCarreras',sigaAgruparPromedio_(cursos,'carrera'));
}

function sigaDibujarPromediosSede_(cursos){
  sigaDibujarBarrasNota_('sigaPromedioSedes',sigaAgruparPromedio_(cursos,'sede'));
}

function sigaEtiquetaCorta_(texto){
  return String(texto)
    .replace(/^Técnico de Nivel Superior en /i,'')
    .replace(/^Técnico de Nivel Superior /i,'');
}

function sigaDibujarBarrasPorcentaje_(id,datos){
  const c=document.getElementById(id);
  if(!c) return;
  if(!datos.length){ c.innerHTML='<div class="chart-empty">No hay datos para la selección actual.</div>'; return; }
  c.innerHTML=datos.map(item=>`
    <div class="bar-row">
      <div class="bar-label" title="${escapeHtml_(item.etiqueta)}">${escapeHtml_(item.etiqueta)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,Math.min(100,item.valor)).toFixed(1)}%"></div></div>
      <div class="bar-value">${item.valor.toFixed(1).replace('.',',')}%</div>
    </div>`).join('');
}

function sigaDibujarBarrasNota_(id,datos){
  const c=document.getElementById(id);
  if(!c) return;
  if(!datos.length){ c.innerHTML='<div class="chart-empty">No hay datos para la selección actual.</div>'; return; }
  c.innerHTML=datos.map(item=>`
    <div class="bar-row">
      <div class="bar-label" title="${escapeHtml_(item.etiqueta)}">${escapeHtml_(item.etiqueta)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,Math.min(100,(item.valor/7)*100)).toFixed(1)}%"></div></div>
      <div class="bar-value">${item.valor.toFixed(2).replace('.',',')}</div>
    </div>`).join('');
}

function sigaDibujarSituacion_(aprobados,reprobados,pendientes){
  const c=document.getElementById('sigaSituacion');
  if(!c) return;
  const total=aprobados+reprobados+pendientes;
  const items=[
    ['Aprobados',aprobados,'ok'],
    ['Reprobados',reprobados,'bad'],
    ['Pendientes',pendientes,'pending']
  ];
  c.innerHTML=items.map(([label,n,clase])=>{
    const pct=total ? n/total*100 : 0;
    return `<div class="siga-status-card ${clase}">
      <div class="siga-status-value">${formatearNumero_(n)}</div>
      <div class="siga-status-label">${label}</div>
      <div class="siga-status-pct">${pct.toFixed(1).replace('.',',')}%</div>
    </div>`;
  }).join('');
}

function sigaDibujarTabla_(filas){
  const tbody=document.getElementById('sigaDetalleAsignaturas');
  if(!tbody) return;
  if(!filas.length){
    tbody.innerHTML='<tr><td colspan="7" class="siga-table-empty">No hay datos para la selección actual.</td></tr>';
    return;
  }

  const ordenadas=[...filas].sort((a,b)=>
    a.idCurso.localeCompare(b.idCurso,'es') ||
    a.asignatura.localeCompare(b.asignatura,'es')
  );

  tbody.innerHTML=ordenadas.map(r=>`
    <tr>
      <td>${escapeHtml_(r.idCurso)}</td>
      <td>${escapeHtml_(r.asignatura)}</td>
      <td class="num">${formatearNumero_(r.evaluaciones)}</td>
      <td class="num">${r.promedio ? r.promedio.toFixed(2).replace('.',',') : '—'}</td>
      <td class="num">${formatearNumero_(r.aprobados)}</td>
      <td class="num">${formatearNumero_(r.reprobados)}</td>
      <td class="num">${formatearNumero_(r.pendientes)}</td>
    </tr>`).join('');
}
</script>
